[project]
name = "automation-module-okta"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.25.0,<2",
    "orjson>=3.7.7,<4",
    "python-dateutil>=2.8.2,<3",
    "requests-ratelimiter>=0.7.0,<1",
    "structlog>=22.3.0,<23",
    "pydantic>=2,<3",
    "urllib3>=2.0.7,<3",
    "okta>=2.9.13,<3",
    "cachetools>=6.2.1,<7",
    "aiolimiter>=1.2.1,<2",
    "setuptools",  # Required for building flatdict from source (okta dependency)
    "flatdict==4.0.0",  # Pinned to 4.0.0 to avoid PEP517 build failure (pkg_resources)
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "requests",
    "requests-mock",
    "types-python-dateutil>=2.8.19.13",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --cache-clear
    --cov=okta_modules
    --cov-report=term-missing:skip-covered
    -ra
"""
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*", "main.py"]