[project]
name = "brevohttp-automation-module"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.11,<4"

dependencies = [
    "brevo-python>=5.0.2",
    "sekoia-automation-sdk",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "requests",
  "requests-mock",
]

[build-system]
requires = ["uv_build>=0.9.7,<1.0.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.mypy]
ignore_missing_imports = true
show_column_numbers = true
show_error_context = false

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=brevohttp_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=5
  --capture=sys
'''
