[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aws-automation"
description = ""
version = "0.0"
authors = []
package-mode = true
[[tool.poetry.packages]]
include = "connectors"

[[tool.poetry.packages]]
include = "aws_helpers"

[tool.black]
line-length = 119
target-version = ["py311"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
exclude = ["tests/*"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
sekoia-automation-sdk = "^1.24.0"
boto3 = ">=1.43.0"
botocore = ">=1.43.0"
aiobotocore = "^3.7.0"
orjson = "^3.11.9"
pandas = "^3.0.3"
pyarrow = "^24.0.0"
loguru = "^0.7.3"
async-lru = "^2.3.0"
aiofiles = "^23.1.0"
aiolimiter = "^1.2.1"
pytz = ">=2024.1"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
  "ignore::async_lru.AlruCacheLoopResetWarning",
]
addopts = "  --strict-markers\n  --tb=short\n  --cov=aws_helpers\n  --cov=connectors\n  --cov-branch\n  --cache-clear\n  --cov-report=html\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=5\n  --numprocesses=auto\n  --asyncio-mode=auto\n"

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.poe.tasks.lint]
help = "Make code linting and formatting."
[[tool.poe.tasks.lint.sequence]]
cmd = "poetry run autoflake --in-place --remove-all-unused-imports --remove-duplicate-keys --remove-unused-variables */**/*.py"

[[tool.poe.tasks.lint.sequence]]
cmd = "poetry run black ."

[[tool.poe.tasks.lint.sequence]]
cmd = "poetry run isort ."

[[tool.poe.tasks.lint.sequence]]
cmd = "poetry run mypy ."

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pytest-xdist = "*"
pytest-env = "*"
requests = "*"
requests-mock = "*"
Faker = "*"
aioresponses = "*"
autoflake = "*"
isort = "*"
mypy = "*"
types-aiofiles = "*"
types-python-dateutil = "*"
pytz = "*"

[tool.poetry.group.dev.dependencies.black]
version = "^26.1.0"
extras = ["colorama"]

[tool.poetry.group.dev.dependencies.poethepoet]
version = "^0.16.5"
extras = ["poetry_plugin"]
