[project]
name = "automation-module-aws"
version = "1.39.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
	"sekoia-automation-sdk>=1.27.0,<2",
	"boto3>=1.43.0",
	"botocore>=1.43.0",
	"aiobotocore>=3.7.0,<4",
	"orjson>=3.11.9,<4",
	"pandas>=3.0.3,<4",
	"pyarrow>=24.0.0,<25",
	"loguru>=0.7.3,<0.8",
	"async-lru>=2.3.0,<3",
	"aiofiles>=23.1.0,<24",
	"aiolimiter>=1.2.1,<2",
	"pytz>=2024.1",
	"ijson>=3.5.1,<4",
]

[dependency-groups]
dev = [
	"aioresponses",
	"faker",
	"mypy>=2.4.0",
	"pytest>=9.0.3,<10",
	"pytest-asyncio",
	"pytest-cov>=7.0.0,<8",
	"pytest-env",
	"pytest-xdist",
	"requests",
	"requests-mock>=1.12.1,<2",
	"ruff>=0.14",
	"types-aiofiles",
	"types-python-dateutil",
	"types-pytz",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E712"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
install_types = true
non_interactive = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
  "ignore::async_lru.AlruCacheLoopResetWarning",
]
addopts = """
	--strict-markers
	--tb=short
	--cov=aws_helpers
	--cov=connectors
	--cov-branch
	--cache-clear
	--cov-report=term-missing:skip-covered
	--cov-fail-under=5
	--numprocesses=auto
	--asyncio-mode=auto
"""

[tool.coverage.run]
omit = ["tests/*", "main.py"]
