[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[project]
name = "automation-module-github"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sekoia-automation-sdk>=1.24.0,<2",
    "structlog>=25.5.0,<26",
    "orjson>=3.11.8,<4",
    "aiohttp>=3.13.5,<4",
    "aiolimiter>=1.2.1,<2",
    "jwt>=1.4.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-xdist>=3.8.0,<4",
    "pytest-env>=1.7.0,<2",
    "requests>=2.34.2,<3",
    "aioresponses>=0.7.8,<0.8",
    "Faker>=13.12.0,<14",
    "isort>=8.0.1,<9",
    "mypy>=2.3.1,<3",
    "gevent>=26.8.0,<27",
    "types-requests>=2.31.0.2,<3",
    "black[colorama]",
    "poethepoet[poetry_plugin]>=0.16.5,<0.17",
    "ruff>=0.16.3",
]

[tool.uv]
package = false
default-groups = "all"

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
exclude = ["tests/*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = '''
  --strict-markers
  --tb=short
  --asyncio-mode=auto
  --cov=github_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=90
'''

[tool.coverage.run]
omit = ["tests/*", "main.py", "github_modules/metrics.py"]
concurrency = ["gevent"]
