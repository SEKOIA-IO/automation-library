    description: 'Return only these activity codes (comma-separated list). Example:
      "52,53,71,72".'
  query:
    type: string
    description: 'Full text search for fields: hash, primary_description, secondary_description'
  skip:
    type: integer
    description: 'Skip first number of items (0-1000). To iterate over more than 1000
      items,  use "cursor". Example: "150".'
    default: null
  groupIds:
    type: array
    items:
      type: string
    description: 'List of Group IDs to filter by. Example: "225494730938493804,225494730938493915".'
  threat_id:
    type: string
    description: 'Threat ID. Example: "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      pagination:
        type: object
        properties:
          nextCursor:
            type: string
            description: Pass this value as "cursor" on your next request, to get
              the next page of results (Will be "null" when last page reached)
            default: null
          totalItems:
            type: integer
            description: Total number of items found matching your query
        required:
        - totalItems
        description: Pagination information
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Activity ID
            createdAt:
              type: string
              description: Activity creation time (UTC)
            updatedAt:
              type: string
              description: Activity last updated time (UTC)
            activityType:
              type: integer
              description: Activity type
            data:
              type: object
              description: Extra activity specific data
            primaryDescription:
              type: string
              description: Primary description
            secondaryDescription:
              type: string
              description: Secondary description
            osFamily:
              type: string
              description: Agent's OS type (if applicable)
              enum:
              - windows
              - linux
              - windows_legacy
              - macos
            hash:
              type: string
              description: Threat file hash (If applicable)
            agentUpdatedVersion:
              type: string
              description: Agent's new version (If applicable)
            userId:
              type: string
              description: The user who invoked the activity (If applicable)
            threatId:
              type: string
              description: Related threat (If applicable)
            agentId:
              type: string
              description: Related Agent (If applicable)
            accountId:
              type: string
              description: Related account (If applicable)
            siteId:
              type: string
              description: Related site (If applicable)
            groupId:
              type: string
              description: Related group (If applicable)
        description: Response data
    required:
    - pagination
    description: Success
