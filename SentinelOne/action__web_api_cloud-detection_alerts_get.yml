                  enum:
                  - Events
                  - Correlation
                  - UEBAFirstSeen
                  - Scheduled
                analystVerdict:
                  type: string
                  description: Analyst verdict
                  enum:
                  - Undefined
                  - True positive
                  - False positive
                  - Suspicious
                incidentStatus:
                  type: string
                  description: Incident status
                  enum:
                  - Unresolved
                  - In progress
                  - Resolved
                srcIp:
                  type: string
                  description: Get the IP address of the traffic source.
                srcPort:
                  type: string
