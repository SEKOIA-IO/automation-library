                fileHashSha1:
                  type: string
                  description: File hash sha1
                fileHashSha256:
                  type: string
                  description: File hash sha256
                fileHashMd5:
                  type: string
                  description: File hash md5
                user:
                  type: string
                  description: User
                effectiveUser:
