  k8sNamespaceLabels__contains:
    type: array
    items:
      type: string
    description: Free-text filter by the endpoint Kubernetes namespace labels (supports
      multiple values)
  ruleName__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by rule name. Example: "rule1".'
  sourceProcessStoryline__equals:
