uuid: dea3b0d1-a09c-5a97-bbcc-ce0d9e336b58
slug: '_web_api_cloud-detection_alerts_get'
name: Get Cloud Detection Alerts
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/cloud-detection/alerts'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        skip: '{{inputs.skip}}'
        limit: '{{inputs.limit}}'
        cursor: '{{inputs.cursor}}'
        countOnly: '{{inputs.countOnly}}'
        skipCount: '{{inputs.skipCount}}'
        sortBy: '{{inputs.sortBy}}'
        sortOrder: '{{inputs.sortOrder}}'
        accountIds: '{{inputs.accountIds}}'
        siteIds: '{{inputs.siteIds}}'
        groupIds: '{{inputs.groupIds}}'
        tenant: '{{inputs.tenant}}'
        ids: '{{inputs.ids}}'
        scopes: '{{inputs.scopes}}'
        createdAt__lt: '{{inputs.createdAt__lt}}'
        createdAt__gt: '{{inputs.createdAt__gt}}'
        createdAt__lte: '{{inputs.createdAt__lte}}'
        createdAt__gte: '{{inputs.createdAt__gte}}'
        reportedAt__lt: '{{inputs.reportedAt__lt}}'
        reportedAt__gt: '{{inputs.reportedAt__gt}}'
        reportedAt__lte: '{{inputs.reportedAt__lte}}'
        reportedAt__gte: '{{inputs.reportedAt__gte}}'
        incidentStatus: '{{inputs.incidentStatus}}'
        severity: '{{inputs.severity}}'
        origAgentOsRevision__contains: '{{inputs.origAgentOsRevision__contains}}'
        origAgentVersion__contains: '{{inputs.origAgentVersion__contains}}'
        origAgentUuid__contains: '{{inputs.origAgentUuid__contains}}'
        origAgentName__contains: '{{inputs.origAgentName__contains}}'
        sourceProcessName__contains: '{{inputs.sourceProcessName__contains}}'
        ruleName__contains: '{{inputs.ruleName__contains}}'
        sourceProcessStoryline__contains: '{{inputs.sourceProcessStoryline__contains}}'
        sourceProcessStoryline__equals: '{{inputs.sourceProcessStoryline__equals}}'
        sourceProcessCommandline__contains: '{{inputs.sourceProcessCommandline__contains}}'
        sourceProcessFileHashSha1__contains: '{{inputs.sourceProcessFileHashSha1__contains}}'
        sourceProcessFileHashSha256__contains: '{{inputs.sourceProcessFileHashSha256__contains}}'
        sourceProcessFileHashMd5__contains: '{{inputs.sourceProcessFileHashMd5__contains}}'
        sourceProcessFilePath__contains: '{{inputs.sourceProcessFilePath__contains}}'
        k8sCluster__contains: '{{inputs.k8sCluster__contains}}'
        k8sNode__contains: '{{inputs.k8sNode__contains}}'
        k8sNamespaceName__contains: '{{inputs.k8sNamespaceName__contains}}'
        k8sNamespaceLabels__contains: '{{inputs.k8sNamespaceLabels__contains}}'
        k8sControllerName__contains: '{{inputs.k8sControllerName__contains}}'
        k8sControllerLabels__contains: '{{inputs.k8sControllerLabels__contains}}'
        k8sPod__contains: '{{inputs.k8sPod__contains}}'
        k8sPodLabels__contains: '{{inputs.k8sPodLabels__contains}}'
        containerName__contains: '{{inputs.containerName__contains}}'
        containerImageName__contains: '{{inputs.containerImageName__contains}}'
        containerLabels__contains: '{{inputs.containerLabels__contains}}'
        query: '{{inputs.query}}'
        analystVerdict: '{{inputs.analystVerdict}}'
        machineType: '{{inputs.machineType}}'
        osType: '{{inputs.osType}}'
        disablePagination: '{{inputs.disablePagination}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get a list of alerts for a given scope
inputs:
  cursor:
    type: string
    description: 'Cursor position returned by the last request. Use to iterate over
      more than 1000 items. Example: "YWdlbnRfaWQ6NTgwMjkzODE=".'
    default: null
  sortOrder:
    type: string
    description: 'Sort direction. Example: "asc".'
    enum:
    - asc
    - desc
    default: null
  ids:
    type: array
    items:
      type: string
    description: 'A list of Alert IDs. Example: "225494730938493804,225494730938493915".'
  createdAt__lt:
    type: string
    description: 'Created at lesser than. Example: "2018-02-27T04:49:26.257525Z".'
  sourceProcessStoryline__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by source storyline. Example: "rule1".'
  accountIds:
    type: array
    items:
      type: string
    description: 'List of Account IDs to filter by. Example: "225494730938493804,225494730938493915".'
  k8sControllerName__contains:
    type: array
    items:
      type: string
    description: Free-text filter by the endpoint Kubernetes controller name (supports
      multiple values)
  containerName__contains:
    type: array
    items:
      type: string
    description: Free-text filter by the endpoint container name (supports multiple
      values)
  query:
    type: string
    description: Full text search for all fields
  osType:
    type: array
    items:
      type: string
      enum:
      - linux
      - windows
      - macos
      - windows_legacy
    description: Included OS types
  sourceProcessFilePath__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by source file path. Example: "rule1".'
  tenant:
    type: boolean
    description: Indicates a tenant scope request
  reportedAt__gt:
    type: string
    description: 'Reported at greater than. Example: "2018-02-27T04:49:26.257525Z".'
  sourceProcessCommandline__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by source commandline. Example: "rule1".'
  createdAt__gt:
    type: string
    description: 'Created at greater than. Example: "2018-02-27T04:49:26.257525Z".'
  origAgentUuid__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by agent UUID. Example: "win7".'
  countOnly:
    type: boolean
    description: If true, only total number of items will be returned, without any
      of the actual objects.
    default: false
  siteIds:
    type: array
    items:
      type: string
    description: 'List of Site IDs to filter by. Example: "225494730938493804,225494730938493915".'
  sourceProcessFileHashMd5__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by source md5. Example: "rule1".'
  containerLabels__contains:
    type: array
    items:
      type: string
    description: Free-text filter by the endpoint container labels (supports multiple
      values)
  hostname:
    type: string
    description: Base URL for the API
  scopes:
    type: array
    items:
      type: string
      enum:
      - site
      - account
      - group
      - global
    description: 'Filter results by scope. Example: "site".'
  origAgentName__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by agent name. Example: "ilia".'
  k8sCluster__contains:
    type: array
    items:
      type: string
    description: Free-text filter by the endpoint Kubernetes cluster name (supports
      multiple values)
  reportedAt__lt:
    type: string
    description: 'Reported at lesser than. Example: "2018-02-27T04:49:26.257525Z".'
  origAgentOsRevision__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by agent OS revision. Example: "win7".'
  sourceProcessFileHashSha256__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by source sha255. Example: "rule1".'
  sourceProcessName__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by source process name. Example: "proc1.exe".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  limit:
    type: integer
    description: 'Limit number of returned items (1-1000). Example: "10".'
    default: 10
  k8sPod__contains:
    type: array
    items:
      type: string
    description: Free-text filter by the endpoint Kubernetes pod name (supports multiple
      values)
  sourceProcessFileHashSha1__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by source sha1. Example: "rule1".'
  analystVerdict:
    type: array
