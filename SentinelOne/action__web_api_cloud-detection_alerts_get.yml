    - agentDetectionInfoOsRevision
    - agentDetectionInfoSiteId
    - agentDetectionInfoUuid
    - agentDetectionInfoVersion
    - alertInfoAlertId
    - alertInfoAnalystVerdict
    - alertInfoCreatedAt
    - alertInfoDvEventId
    - alertInfoEventType
    - alertInfoHitType
    - alertInfoIncidentStatus
    - alertInfoReportedAt
    - alertInfoSource
    - containerInfoId
    - containerInfoImage
    - containerInfoLabels
    - containerInfoName
    - kubernetesInfoCluster
    - kubernetesInfoControllerKind
    - kubernetesInfoControllerLabels
    - kubernetesInfoControllerName
    - kubernetesInfoNamespace
    - kubernetesInfoNamespaceLabels
    - kubernetesInfoNode
    - kubernetesInfoPod
    - kubernetesInfoPodLabels
    - ruleInfoDescription
