          totalItems:
            type: integer
            description: Total number of items found matching your query
        required:
        - totalItems
        description: Pagination information
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: array
        items:
          type: object
          properties:
            alertInfo:
              type: object
