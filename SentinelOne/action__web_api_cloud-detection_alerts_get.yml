    - ruleInfoName
    - ruleInfoScopeLevel
    - ruleInfoSeverity
    - ruleInfoTreatAsThreat
    - sourceParentProcessInfoCommandline
    - sourceParentProcessInfoFileHashMd5
    - sourceParentProcessInfoFileHashSha1
    - sourceParentProcessInfoFileHashSha256
    - sourceParentProcessInfoFilePath
    - sourceParentProcessInfoFileSignerIdentity
    - sourceParentProcessInfoName
    - sourceParentProcessInfoPid
    - sourceParentProcessInfoPidStarttime
    - sourceParentProcessInfoStoryline
    - sourceParentProcessInfoIntegrityLevel
    - sourceParentProcessInfoSubsystem
    - sourceParentProcessInfoUser
    - sourceProcessInfoCommandline
    - sourceProcessInfoFileHashMd5
    - sourceProcessInfoFileHashSha1
    - sourceProcessInfoFileHashSha256
    - sourceProcessInfoFilePath
    - sourceProcessInfoFileSignerIdentity
    - sourceProcessInfoName
    - sourceProcessInfoPid
    - sourceProcessInfoPidStarttime
    - sourceProcessInfoStoryline
    - sourceProcessInfoIntegrityLevel
    - sourceProcessInfoSubsystem
    - sourceProcessInfoUser
