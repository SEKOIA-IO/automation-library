uuid: fd044ed2-46a2-5b5d-9cd8-c0fe73f1630a
slug: '_web_api_firewall-control_{firewall_rule_category}_protocols_get'
name: Get Firewall Control By Firewall Rule Category Protocols
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/firewall-control/{{inputs.firewall_rule_category}}/protocols'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        skip: '{{inputs.skip}}'
        limit: '{{inputs.limit}}'
        cursor: '{{inputs.cursor}}'
        countOnly: '{{inputs.countOnly}}'
        skipCount: '{{inputs.skipCount}}'
        sortBy: '{{inputs.sortBy}}'
        sortOrder: '{{inputs.sortOrder}}'
        query: '{{inputs.query}}'
        disablePagination: '{{inputs.disablePagination}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get a list of protocols that can be used in Firewall Control rules.
inputs:
  sortBy:
    type: string
    description: 'The column to sort the results by. Example: "id".'
    enum:
    - name
    default: null
  countOnly:
    type: boolean
    description: If true, only total number of items will be returned, without any
      of the actual objects.
    default: false
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  limit:
    type: integer
    description: 'Limit number of returned items (1-1000). Example: "10".'
    default: 10
  cursor:
    type: string
    description: 'Cursor position returned by the last request. Use to iterate over
      more than 1000 items. Example: "YWdlbnRfaWQ6NTgwMjkzODE=".'
    default: null
  sortOrder:
    type: string
    description: 'Sort direction. Example: "asc".'
    enum:
    - asc
    - desc
    default: null
  skipCount:
    type: boolean
    description: If true, total number of items will not be calculated, which speeds
      up execution time.
    default: null
  disablePagination:
    type: boolean
    description: If true, all rules for requested scope will be returned
  query:
    type: string
    description: Full text search on protocols
  skip:
    type: integer
    description: 'Skip first number of items (0-1000). To iterate over more than 1000
      items,  use "cursor". Example: "150".'
    default: null
  hostname:
    type: string
    description: Base URL for the API
  firewall_rule_category:
    type: string
    description: To affect Network Quarantine use network-quarantine
outputs:
  result:
    type: object
    properties:
      pagination:
        type: object
        properties:
          nextCursor:
            type: string
            description: Pass this value as "cursor" on your next request, to get
              the next page of results (Will be "null" when last page reached)
            default: null
          totalItems:
            type: integer
            description: Total number of items found matching your query
        required:
        - totalItems
        description: Pagination information
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: array
        items:
          type: object
          properties:
            accountIds:
              type: array
              items:
                type: string
              description: List of Account IDs to filter by
            siteIds:
              type: array
              items:
                type: string
              description: List of Site IDs to filter by
            groupIds:
              type: array
              items:
                type: string
              description: List of Group IDs to filter by
            tenant:
              type: boolean
              description: Indicates a tenant scope request
            value:
              type: string
              description: Short code identifying the protocol
            name:
              type: string
              description: Description of the protocol
        description: Response data
    required:
    - pagination
    description: Success
