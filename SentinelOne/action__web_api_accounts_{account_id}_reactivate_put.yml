uuid: e41c2951-9307-5b3d-99d8-5c4ebc49280f
slug: '_web_api_accounts_{account_id}_reactivate_put'
name: Update Accounts By Account ID Reactivate
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: PUT
      url: '{{inputs.hostname}}/web/api/v2.1/accounts/{{inputs.account_id}}/reactivate'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: Account not found
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Reactivate an expired Account. This command requires a Global user or
  Support. Consult with your SentinelOne SE.
inputs:
  data:
    type: object
    properties:
      unlimited:
        type: boolean
        description: If false enter an expiration date and time (yyyy-mm-ddThh:mm:ss
        default: false
      expiration:
        type: string
        description: New expiration date for the Account
        default: null
    description: Data
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  account_id:
    type: string
    description: 'Account ID. You can get the ID from the Get accounts command. Example:
      "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: Account reactivated
