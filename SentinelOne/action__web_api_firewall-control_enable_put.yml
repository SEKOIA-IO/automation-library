uuid: 442780e0-75a3-5586-a293-9806cdb68313
slug: '_web_api_firewall-control_enable_put'
name: Update Firewall Control Enable
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: PUT
      url: '{{inputs.hostname}}/web/api/v2.1/firewall-control/enable'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        filter: '{{inputs.filter}}'
        data: '{{inputs.data}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Change the status of a set of Firewall Control rules that match the filter
  to "Enabled" or "Disabled". In one request, you can set one status or the other.
inputs:
  filter:
    type: object
    properties:
      accountIds:
        type: array
        items:
          type: string
        description: List of Account IDs to filter by
      siteIds:
        type: array
        items:
          type: string
        description: List of Site IDs to filter by
      groupIds:
        type: array
        items:
          type: string
        description: List of Group IDs to filter by
      tenant:
        type: boolean
        description: Indicates a tenant scope request
      query:
        type: string
        description: Free text search on name, tag, application, protocol
      scopes:
        type: array
        items:
          type: string
          enum:
          - site
          - group
          - global
          - account
        description: Return only firewall rules in this scope
      applications:
        type: array
        items:
          type: string
        description: Return firewall rules with the filtered firewall class.
      name:
        type: string
        description: Return firewall rules with the filtered name.
      protocols:
        type: array
        items:
          type: string
        description: Return firewall rules with the filtered protocols.
      osTypes:
        type: array
        items:
          type: string
          description: OS type
          enum:
          - windows
          - linux
          - windows_legacy
          - macos
        description: Return firewall rules with the filtered os_type.
      directions:
        type: array
        items:
          type: string
          enum:
          - any
          - inbound
          - outbound
        description: Return firewall rules with the filtered directions.
      actions:
        type: array
        items:
          type: string
          enum:
          - Allow
          - Block
        description: Return firewall rules with the filtered action.
      statuses:
        type: array
        items:
          type: string
          enum:
          - Enabled
          - Disabled
        description: Return firewall rules with the filtered status.
      createdAt__lt:
        type: string
        description: Return firewall rules created before this timestamp.
      createdAt__gt:
        type: string
        description: Return firewall rules created after this timestamp.
      createdAt__lte:
        type: string
        description: Return firewall rules created before or at this timestamp.
      createdAt__gte:
        type: string
        description: Return firewall rules created after or at this timestamp.
      createdAt__between:
        type: string
        description: Return firewall rules created within this range (inclusive)
      ids:
        type: array
        items:
          type: string
        description: List of ids to filter by
      locationIds:
        type: array
        items:
          type: string
        description: Filter by associated locations
      tagIds:
        type: array
        items:
          type: string
        description: Filter by associated tags
      name__contains:
        type: array
        items:
          type: string
        description: Free-text filter by the Rule name (supports multiple values)
      tagName__contains:
        type: array
        items:
          type: string
        description: Free-text filter by the Tag name (supports multiple values)
      application__contains:
        type: array
        items:
          type: string
        description: Free-text filter by application (supports multiple values)
      protocol__contains:
        type: array
        items:
          type: string
        description: Free-text filter by protocol (supports multiple values)
      service__contains:
        type: array
        items:
          type: string
        description: Free-text filter by service (supports multiple values)
    description: Filter
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      status:
        type: string
        description: should the rules be enabled/disabled
        enum:
        - Enabled
        - Disabled
    required:
    - status
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          affected:
            type: integer
            description: Number of entities affected by the requested operation
        description: Response data
    description: Success
