uuid: 46b36397-90d8-577e-9ad3-e9ded3ded561
slug: '_web_api_accounts_{account_id}_uninstall-password_generate_post'
name: Create Accounts By Account ID Uninstall Password Generate
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/accounts/{{inputs.account_id}}/uninstall-password/generate'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Insufficient permissions
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: 'You can uninstall all Agents of one Account with one command that requires
  a password. This command sets a new account-level uninstall password.<br>To enable
  this feature, submit a ticket with Support.<br>Best Practice: After you uninstall
  the Agents and install again, revoke the passphrase.<br>Applicable on Windows (versions
  4.4+) and Linux (versions 21.7+) Agents.'
inputs:
  data:
    type: object
    properties:
      expiration:
        type: string
        description: 'password expiration date format: yyyy-mm-dd'
    required:
    - expiration
    description: Data
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  account_id:
    type: string
    description: 'Account ID. You can get the ID from the Get accounts command. Example:
      "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          expiration:
            type: string
            description: 'password expiration date format: yyyy-mm-dd'
          version:
            type: integer
            description: Version
          createdAt:
            type: string
            description: 'password creation date: yyyy-mm-dd'
          lastRevoked:
            type: string
            description: uninstall password last revoked date
          revokedById:
            type: integer
            description: The ID of the user that revoked the uninstall password
          revokedByName:
            type: string
            description: Revoked by name
          generatedById:
            type: integer
            description: The ID of the user that generated the uninstall password
          generatedByName:
            type: string
            description: name of the user that generated the uninstall password
        required:
        - generatedByName
        - lastRevoked
        - revokedByName
        - version
        description: Response data
    description: Success
