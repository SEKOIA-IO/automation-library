uuid: 12b3c0ae-084f-5b31-aaf9-467a6241d84b
slug: '_web_api_users_2fa_disable_post'
name: Create Users 2FA Disable
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/2fa/disable'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: No permission for the action
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Disable Two-Factor Authentication for one user. This requires the ID
  of the user (run "users").
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      id:
        type: string
        description: User ID
      currentPassword:
        type: string
        description: Current password
      twoFaCode:
        type: string
        description: Two-Factor Authorization code
    required:
    - id
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: 2FA successfully disabled
