uuid: ddf73a06-33cd-54e5-9472-b38a1e3faad5
slug: '_sdl_v2_api_datatables_post'
name: Create Datatables
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/sdl/v2/api/datatables'
      headers:
        x-request-id: '{{inputs.x_request_id}}'
        S1-Scope: '{{inputs.S1_Scope}}'
        Authorization: '{{inputs.api_token}}'
      params:
        id: '{{inputs.id}}'
        description: '{{inputs.description}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Bad Request. The `id` query parameter is missing, or `id` does not match
          the required pattern.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized. Authentication is required or the provided credentials
          are invalid.
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Forbidden. Either the user does not have the Manage Datatables permission,
          or the Datatables REST API has not been enabled for this account.
      error_409:
        predicate: '{{response.status_code != 409}}'
        fail: Conflict. A datatable with the specified `id` already exists.
      error_500:
        predicate: '{{response.status_code != 500}}'
        fail: Internal Server Error. An unexpected error occurred while processing
          the request.
      success:
        predicate: '{{response.status_code == 201}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Creates a new datatable with the given `id` and content.
inputs:
  description:
    type: string
    description: Optional description of the datatable.
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  S1_Scope:
    type: string
    description: Optional scope override, of the form `<accountScopeId>:<siteScopeId>`
      or just `<accountScopeId>`. Determines whether the operation applies at global,
      account, or site scope.
  x_request_id:
    type: string
    description: Optional caller-supplied trace id. When present, it is used as the
      request's correlation id and is always included in the logged event attributes
      for this request.
  id:
    type: string
    description: Unique identifier for the new datatable, for example `my-table.csv`
      or `my-table.json`. The `.csv`/`.json` suffix determines how the content is
      interpreted; it is not inferred from a `Content-Type` header. Must match `^[a-zA-Z0-9._-]{1,255}$`
      and must not already be in use.
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      id:
        type: string
        description: Unique identifier for the datatable.
      description:
        type: string
        description: Description of the datatable.
      sizeBytes:
        type: integer
        description: Size of the datatable content in bytes.
      createdAt:
        type: string
        description: UTC timestamp when the datatable was created.
      updatedAt:
        type: string
        description: UTC timestamp when the datatable was last updated.
    required:
    - id
    - createdAt
    description: Metadata for a datatable.
