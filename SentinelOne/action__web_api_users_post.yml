uuid: 9a2fae2f-71e0-54dd-b6d0-2041d3d70a81
slug: '_web_api_users_post'
name: Create Users
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Not enough permissions to create user.
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Create a new user.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      tenantRoles:
        type: array
        items:
          type: string
        description: '[DEPRECATED] Use roles instead. List of tenant roles.'
        default: []
      siteRoles:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Site ID
            name:
              type: string
              description: '[DEPRECATED] Site name'
              default: null
            roles:
              type: array
              items:
                type: string
              description: '[DEPRECATED] List containing the desired role name in
                this scope. Use role_id instead.'
            roleName:
              type: string
              description: '[DEPRECATED] Name of the role, will work only for predefined
                roles'
            roleId:
              type: string
              description: ID of the wanted role
          required:
          - id
        description: '[DEPRECATED] Please use scopeRoles instead.'
        default: []
      twoFaEnabled:
        type: boolean
        description: Two fa enabled
      scope:
        type: string
        description: User scope
        enum:
        - tenant
        - account
        - site
      allowRemoteShell:
        type: boolean
        description: '[DEPRECATED] Unused field. The user''s role will determine if
          it is allowed to use remote_shell.'
      scopeRoles:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Scope ID
            roles:
              type: array
              items:
                type: string
              description: '[DEPRECATED] List containing the desired role name in
                this scope. Use role_id or role_name instead.'
            roleName:
              type: string
              description: '[DEPRECATED] Name of the role, will work only for predefined
                roles'
            roleId:
              type: string
              description: ID of the wanted role
        description: List of id and role id, id is mandatory for user in scope account/site.
          Role name is deprecated and will work only for predefined roles, please
          use role id. User in tenant (global) role does not need to provide an id.
        default: []
      password:
        type: string
        description: User password. Not allowed if automatic onboarding feature is
          enabled.
      fullName:
        type: string
        description: Full name of the user
      email:
        type: string
        description: The email of the user
        pattern: (^[-!#$%&'*+/=?^_`{}|~0-9A-Z]+(\.[-!#$%&'*+/=?^_`{}|~0-9A-Z]+)*|^"([\001-\010\013\014\016-\037!#-\[\]-\177]|\\[\001-011\013\014\016-\177])*")@(?:[A-Z0-9](?:[A-Z0-9(-|_).]{0,259}[A-Z0-9])?)$
      forceCredentialAuth:
        type: boolean
        description: If true, default behaviour is ignored, credential auth type is
          forced
    required:
    - email
    - fullName
    - scope
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          id:
            type: string
            description: Id
          source:
            type: string
            description: Source
          globalUserId:
            type: string
            description: Global user id
            default: null
          globalOrganizationId:
            type: string
            description: Global organization id
            default: null
          email:
            type: string
            description: Email
            pattern: (^[-!#$%&'*+/=?^_`{}|~0-9A-Z]+(\.[-!#$%&'*+/=?^_`{}|~0-9A-Z]+)*|^"([\001-\010\013\014\016-\037!#-\[\]-\177]|\\[\001-011\013\014\016-\177])*")@(?:[A-Z0-9](?:[A-Z0-9(-|_).]{0,259}[A-Z0-9])?)$
            default: null
          emailReadOnly:
            type: boolean
            description: True if email cannot be modified
          fullName:
            type: string
            description: Full name
            default: null
          fullNameReadOnly:
            type: boolean
            description: True if full name cannot be modified
          firstLogin:
            type: string
            description: First login
          lastLogin:
            type: string
            description: Last login
          dateJoined:
            type: string
            description: Date joined
          lowestRole:
            type: string
            description: '[DEPRECATED] in RBAC there''s no ''lowest'' role. Returns
              Admin if user has admin permission on all sites, otherwise a different
              role.'
          groupsReadOnly:
            type: boolean
            description: '[Deprecated]'
          twoFaEnabled:
            type: boolean
            description: Two fa enabled
          primaryTwoFaMethod:
            type: string
            description: Primary two fa method
          emailVerified:
            type: boolean
            description: True if user verification completed successfully
          scope:
            type: string
            description: User Scope
            enum:
            - tenant
            - account
            - site
          apiToken:
            type: object
            properties:
              createdAt:
                type: string
                description: Created at
              expiresAt:
                type: string
                description: Expires at
            description: Api token
          twoFaEnabledReadOnly:
            type: boolean
            description: True if two fa option cannot be modified
          agreedEula:
            type: boolean
            description: True if EULA was agreed for user's sites
          agreementUrl:
            type: string
            description: Link to EULA agreement if it was not agreed yet
          allowRemoteShell:
            type: boolean
            description: '[DEPRECATED] Unused field. The user''s role will determine
              if it is allowed to use remote_shell.'
          twoFaConfigured:
            type: boolean
            description: User 2FA Auth is configured
          scopeRoles:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Scope ID
                roles:
                  type: array
                  items:
                    type: string
                  description: '[DEPRECATED] List containing the desired role name
                    in this scope. Use role_id or role_name instead.'
                roleName:
                  type: string
                  description: '[DEPRECATED] Name of the role, will work only for
                    predefined roles'
                roleId:
                  type: string
                  description: ID of the wanted role
                name:
                  type: string
                  description: Scope name
                accountName:
                  type: string
                  description: Scope name
              required:
              - accountName
              - name
            description: Roles of the scope user
          isSystem:
            type: boolean
          isExternalLoginUser:
            type: boolean
            description: Is external login user
          canGenerateApiToken:
            type: boolean
            description: Can generate api token
          elevatedSessionDurationMinutes:
            type: integer
            description: Defines for how many minutes can the user call protected
              actions once their session is elevated.
          twoFaStatus:
            type: string
            description: State of 2FA setup
            enum:
            - configured
            - not_configured
            - enrolled
            - enrollment_expired
          tenantRoles:
            type: array
            items:
              type: string
            description: '[DEPRECATED] Role ids for the tenant user. Using scopeRoles
              is more consistent.'
            default: []
          siteRoles:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Site ID
                name:
                  type: string
                  description: Site name
                roles:
                  type: array
                  items:
                    type: string
                  description: '[DEPRECATED] List containing the desired role name
                    in this scope. Use role_id instead.'
                roleName:
                  type: string
                  description: '[DEPRECATED] Name of the role, will work only for
                    predefined roles'
                roleId:
                  type: string
                  description: ID of the wanted role
              required:
              - id
              - name
            description: '[DEPRECATED] Role and site ids for the user. Using scopeRoles
              is more consistent.'
        required:
        - scope
        description: Response data
    description: User created successfully.
