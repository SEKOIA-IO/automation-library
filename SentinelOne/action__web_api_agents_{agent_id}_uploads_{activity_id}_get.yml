uuid: 2b5cec41-7543-581b-ae9a-b72fe0ca499b
slug: '_web_api_agents_{agent_id}_uploads_{activity_id}_get'
name: Get Agents By Agent ID Uploads By Activity ID
pipeline:
- name: http
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/agents/{{inputs.agent_id}}/uploads/{{inputs.activity_id}}'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: Agent or activity not found
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Insufficient permissions
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
description: Get Agent logs from Agents that match the filter. You can filter by Agent
  ID (run "agents" to get the ID) or by Activity ID (run "activities/types" to get
  the Activity ID). Send the logs to SentinelOne Support for assistance.
inputs:
  activity_id:
    type: string
    description: 'ID of activity that logs files uploaded by agent. Example: "225494730938493804".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  agent_id:
    type: string
    description: 'Agent ID. Example: "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
