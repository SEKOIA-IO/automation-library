uuid: 85d9d7ce-11fc-5ee0-946a-3959ef2b35ad
slug: '_web_api_users_onboarding_validate-token_get'
name: Get Users Onboarding Validate Token
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/users/onboarding/validate-token'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        token: '{{inputs.token}}'
        resetPasswordFlow: '{{inputs.resetPasswordFlow}}'
    asserts:
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: A user matching the input verification token wasn't found
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Verification failed
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: When a new user verifies their email, the Management gets a token.  Use
  this command to validate the token.
inputs:
  resetPasswordFlow:
    type: boolean
    description: Reset password flow
    default: false
  token:
    type: string
    description: Verification token
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: Token is valid
