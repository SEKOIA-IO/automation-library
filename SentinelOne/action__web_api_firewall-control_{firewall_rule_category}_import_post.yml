uuid: 485f2c03-526e-5b02-9307-600d80ac39af
slug: '_web_api_firewall-control_{firewall_rule_category}_import_post'
name: Create Firewall Control By Firewall Rule Category Import
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/firewall-control/{{inputs.firewall_rule_category}}/import'
      headers:
        Authorization: '{{inputs.api_token}}'
      form:
        accountIds: '{{inputs.accountIds}}'
        siteIds: '{{inputs.siteIds}}'
        groupIds: '{{inputs.groupIds}}'
        tenant: '{{inputs.tenant}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Import Firewall Control rules from an exported JSON file to scopes specified
  by ID (run "accounts", "sites", "groups", or leave the scope empty and set "tenant"
  to "true").<br>Firewall Control requires Control SKU, in the target and in the source.
inputs:
  siteIds:
    type: array
    items:
      type: string
    description: 'List of Site IDs to filter by. Example: "225494730938493804,225494730938493915".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  tenant:
    type: boolean
    description: Indicates a tenant scope request
  accountIds:
    type: array
    items:
      type: string
    description: 'List of Account IDs to filter by. Example: "225494730938493804,225494730938493915".'
  firewall_rule_category:
    type: string
    description: To affect Network Quarantine use network-quarantine
  groupIds:
    type: array
    items:
      type: string
    description: 'List of Group IDs to filter by. Example: "225494730938493804,225494730938493915".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: Success
