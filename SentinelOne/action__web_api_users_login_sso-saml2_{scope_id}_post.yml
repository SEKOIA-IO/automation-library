uuid: 8306433c-d559-5784-98a6-ef5180e163f1
slug: '_web_api_users_login_sso-saml2_{scope_id}_post'
name: Create Users Login SSO SAML2 By Scope ID
pipeline:
- name: http
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/login/sso-saml2/{{inputs.scope_id}}'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: Site not found.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Not authenticated user.
      success:
        predicate: '{{(response.status_code >= 200 and response.status_code <= 299)}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
description: Authenticate a Single Sign-On response over SAML v2 protocol.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  scope_id:
    type: string
    description: 'Scope ID. Example: "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
