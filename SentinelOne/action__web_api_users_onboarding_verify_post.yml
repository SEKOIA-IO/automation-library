uuid: 346eef19-fe5e-5770-b644-59f490d88c03
slug: '_web_api_users_onboarding_verify_post'
name: Create Users Onboarding Verify
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/onboarding/verify'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: A user matching the input verification token wasn't found
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Verification failed
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: When a new user verifies their email, the Management gets a token. Use
  this command to verify the token and set a new password.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      token:
        type: string
        description: Verification token
      resetPasswordFlow:
        type: boolean
        description: Reset password flow
        default: false
      password:
        type: string
        description: User selected password
    required:
    - password
    - token
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: User successfully verified
