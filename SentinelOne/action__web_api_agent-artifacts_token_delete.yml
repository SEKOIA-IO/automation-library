uuid: 8a1438d8-b7e6-5fc4-8eae-b95741bcad79
slug: '_web_api_agent-artifacts_token_delete'
name: Delete Agent Artifacts Token
pipeline:
- name: http
stages:
  http:
    kind: http
    properties:
      method: DELETE
      url: '{{inputs.hostname}}/web/api/v2.1/agent-artifacts/token'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        scope_level: '{{inputs.scope_level}}'
        scope_id: '{{inputs.scope_id}}'
        token_id: '{{inputs.token_id}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid request
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: Not found
      error_500:
        predicate: '{{response.status_code != 500}}'
        fail: Internal error
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
description: Deletes an access token for the S1 Agent Artifacts Repository
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  scope_level:
    type: string
    description: 'Scope level to list the tokens for. Possible values: ''site'', ''account'''
  token_id:
    type: integer
    description: 'token id of the token to be deleted, example: ''42'''
  scope_id:
    type: integer
    description: 'Scope id to list the tokens for, example: ''983604236220743370'''
  hostname:
    type: string
    description: Base URL for the API
