uuid: 37501aab-72c8-5f24-80f2-8fe8dfe0e175
slug: '_web_api_users_login_set-password_post'
name: Create Users Login Set Password
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/login/set-password'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Sets a new password for the user. <br>Used by forced password reset and
  password expiration flows. <br>Accepts temporary tokens from /users/login with error
  codes 4010091 and 4010092.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      password:
        type: string
        description: The new password
      token:
        type: string
        description: Verification token
    required:
    - password
    - token
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          token:
            type: string
            description: Generated authentication token
          csrf:
            type: string
            description: Generated csrf token
        required:
        - token
        description: Response data
    description: Password was set
