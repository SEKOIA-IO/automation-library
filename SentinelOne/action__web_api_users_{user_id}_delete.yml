uuid: e9e3f2e4-c531-51af-a378-3f185139f772
slug: '_web_api_users_{user_id}_delete'
name: Delete Users By User ID
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: DELETE
      url: '{{inputs.hostname}}/web/api/v2.1/users/{{inputs.user_id}}'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Insufficient permissions.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Delete a user by ID.
inputs:
  user_id:
    type: string
    description: 'User ID. Example: "225494730938493804".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: User deleted successfully.
