          editable:
            type: boolean
            description: True if the rule can be modified at this scope level.
          createdAt:
            type: string
            description: The date the rule was created.
          updatedAt:
            type: string
            description: The date the rule was last updated.
          creator:
            type: string
            description: The email of the user that created the rule.
          creatorId:
            type: string
            description: The ID of the user that created the rule.
          updaterId:
            type: string
            description: The ID of the user that last updated the rule.
          expired:
            type: boolean
            description: True if the Rule has expired.
          reachedLimit:
            type: boolean
            description: True if the Rule reached the 5k/hour or 10k/day alert limit.
              If the limit has been reached, the Rule is disabled.
          statusReason:
            type: string
            description: The reason why the Rule has its current status.
          networkQuarantine:
            type: boolean
            description: True if the network quarantine is on.
          treatAsThreat:
            type: string
            description: The Treat as threat auto response - UNDEFINED/suspicious/malicious
            enum:
            - UNDEFINED
            - Suspicious
            - Malicious
          queryLang:
            type: string
            description: The s1ql version query language of the rule. Can be 1.0 or
              2.0.
            enum:
            - '1.0'
            - '2.0'
            default: '1.0'
          correlationParams:
            type: object
            properties:
              subQueries:
                type: array
                items:
                  type: object
                  properties:
                    subQuery:
                      type: string
                      description: A subquery
                    matchesRequired:
                      type: integer
                      description: The number of times a subquery must match.
                  required:
