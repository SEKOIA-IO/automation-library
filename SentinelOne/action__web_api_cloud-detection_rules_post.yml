                  If the lookbackWindowMinutes is less than 60 (1 hour), the minimum
                  is 1 minute. For a window between 1 and 360 (6 hours), 5 minutes.
                  For a window between 360 (6 hours) and 10080 (7 days), 15 minutes.
                  For a window between 10080 (7 days) and 43200 (30 days), 60 minutes.
              lookbackWindowMinutes:
                type: integer
                description: Sets the evaluation lookback window in minutes. For example,
                  set to 5 evaluates the alert over the past five minutes.
              threshold:
                type: object
                properties:
                  value:
                    type: integer
                    description: Defines the threshold value that in combination with
                      operator and the query sets the threshold condition for an alert
                      to be triggered. The default value is 0
                    default: 0
                  operator:
                    type: string
                    description: Defines the operator to use in combination with the
                      query and thresholdValue to set the threshold condition for
