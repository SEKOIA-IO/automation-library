                  of ORs). Each inner array is an OR-group; the outer array ANDs them
                  together. The product of the group sizes (aliases in group 1 x aliases
                  in group 2 x ...) must not be more than the configured limit, because
                  the engine tracks at most that many entities per event. The live
                  limit is in the /cloud-detection/rules/config response. Required
                  when entity is Custom; must be omitted otherwise.
            required:
            - entity
            - matchInOrder
            description: Correlation params
          scheduledParams:
            type: object
            properties:
              query:
                type: string
                description: The PowerQuery to run
              runIntervalMinutes:
