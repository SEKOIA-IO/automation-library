uuid: a32499c4-a19e-5660-a519-227ea7cd9120
slug: '_web_api_users_generate-api-token_post'
name: Create Users Generate API Token
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/generate-api-token'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_409:
        predicate: '{{response.status_code != 409}}'
        fail: API token conflict (already generated)
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get the API token for the authenticated user.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      forceLegacy:
        type: boolean
        description: 'Temporary attribute for WA: If the flag is set to True the legacy
          token will be generated even if the auth_tokens global switch is turned
          on'
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          token:
            type: string
            description: User's API token
        required:
        - token
        description: Response data
    description: API token delivered to user
