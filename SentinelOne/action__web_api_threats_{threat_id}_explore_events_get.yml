uuid: 107fa7f5-cb9c-50cc-9670-5b999af02522
slug: '_web_api_threats_{threat_id}_explore_events_get'
name: Get Threats By Threat ID Explore Events
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/threats/{{inputs.threat_id}}/explore/events'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        skip: '{{inputs.skip}}'
        limit: '{{inputs.limit}}'
        cursor: '{{inputs.cursor}}'
        countOnly: '{{inputs.countOnly}}'
        skipCount: '{{inputs.skipCount}}'
        sortBy: '{{inputs.sortBy}}'
        sortOrder: '{{inputs.sortOrder}}'
        eventTypes: '{{inputs.eventTypes}}'
        eventSubTypes: '{{inputs.eventSubTypes}}'
        eventId: '{{inputs.eventId}}'
        processName__like: '{{inputs.processName__like}}'
        aiSessionId: '{{inputs.aiSessionId}}'
        aiPromptId: '{{inputs.aiPromptId}}'
        aiToolCallId: '{{inputs.aiToolCallId}}'
        aiToolName: '{{inputs.aiToolName}}'
        aiVerdict: '{{inputs.aiVerdict}}'
        aiSkillIds: '{{inputs.aiSkillIds}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get all threat events.
inputs:
  cursor:
    type: string
    description: 'Cursor position returned by the last request. Use to iterate over
      more than 1000 items. Example: "YWdlbnRfaWQ6NTgwMjkzODE=".'
    default: null
  sortOrder:
    type: string
    description: 'Sort direction. Example: "asc".'
    enum:
    - asc
    - desc
    default: null
  hostname:
    type: string
    description: Base URL for the API
  countOnly:
    type: boolean
    description: If true, only total number of items will be returned, without any
      of the actual objects.
    default: false
  aiToolCallId:
    type: string
    description: Filter AI agent events by tool call ID (also includes its prompt)
  threat_id:
    type: string
    description: 'Threat ID. Example: "225494730938493804".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  limit:
    type: integer
    description: 'Limit number of returned items (1-1000). Example: "10".'
    default: 10
  eventSubTypes:
    type: array
    items:
      type: string
      enum:
      - PROCESSCREATION
      - PROCESSTERMINATION
      - PROCESSMODIFICATION
      - TCPV4
      - TCPV6
      - TCPV4LISTEN
      - TCPV6LISTEN
      - FILEMODIFICATION
      - FILESCAN
      - FILECREATION
      - FILEDELETION
      - FILERENAME
      - LOGIN
      - LOGOUT
      - HTTP
      - DNS
      - SCHEDTASKREGISTER
      - SCHEDTASKSTART
      - SCHEDTASKUPDATE
      - SCHEDTASKTRIGGER
      - SCHEDTASKDELETE
      - REGKEYCREATE
      - REGKEYRENAME
      - REGKEYDELETE
      - REGKEYEXPORT
      - REGKEYSECURITYCHANGED
      - REGKEYIMPORT
      - REGVALUEMODIFIED
      - REGVALUECREATE
      - REGISTRYACTION
      - BEHAVIORALINDICATORS
      - MODULE
      - AIAGENTSESSIONSTART
      - AIAGENTSESSIONEND
      - AIAGENTPROMPTSUBMIT
      - AIAGENTPROMPTCOMPLETE
      - AIAGENTTOOLCALLINVOKE
      - AIAGENTTOOLCALLCOMPLETE
      - AIAGENTSKILLLOADED
      - AIAGENTTOOLCREATEDPROCESS
    description: 'Filter events by sub-type. Example: "PROCESSCREATION".'
  aiSkillIds:
    type: array
    items:
      type: string
    description: Filter AI agent events by skill ID, comma-separated (also includes
      their session)
  aiSessionId:
    type: string
    description: Filter AI agent events by session ID
  aiVerdict:
    type: string
    description: Filter AI agent events by verdict
  eventTypes:
    type: array
    items:
      type: string
      enum:
      - events
      - file
      - ip
      - url
      - dns
      - process
      - registry
      - scheduled_task
      - logins
      - indicators
      - module
      - ai_agent
    description: 'Filter events by type. Example: "events".'
  sortBy:
    type: string
    description: 'The column to sort the results by. Example: "id".'
    enum:
    - id
    - createdAt
    - eventType
    - fileSize
    - fileType
    - registryPath
    - registryId
    - registryClassification
    - pid
    - processName
    default: null
  aiToolName:
    type: string
    description: Filter AI agent events by tool name
  processName__like:
    type: string
    description: Filter by process name (substring)
  skipCount:
    type: boolean
    description: If true, total number of items will not be calculated, which speeds
      up execution time.
    default: null
  skip:
    type: integer
    description: 'Skip first number of items (0-1000). To iterate over more than 1000
      items,  use "cursor". Example: "150".'
    default: null
  aiPromptId:
    type: string
    description: Filter AI agent events by prompt ID (also includes its session and
      its loaded skills)
  eventId:
    type: string
    description: Filter by a specific process key and its children
