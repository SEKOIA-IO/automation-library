uuid: cd9159f5-612f-54ee-9e34-5a18ba911504
slug: '_web_api_accounts_{account_id}_policy_put'
name: Update Accounts By Account ID Policy
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: PUT
      url: '{{inputs.hostname}}/web/api/v2.1/accounts/{{inputs.account_id}}/policy'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: Account not found
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
