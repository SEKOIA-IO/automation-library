uuid: 9212ea70-9c23-53b9-a793-c3973eda4391
slug: '_web_api_users_tenant-admin-auth-check_get'
name: Get Users Tenant Admin Auth Check
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/users/tenant-admin-auth-check'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Insufficient permissions
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: See if logged in user is a user with the Global scope of access.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: User is Global.
