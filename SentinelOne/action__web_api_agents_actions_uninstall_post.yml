slug: '_web_api_agents_actions_uninstall_post'
name: Uninstall Agents
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/agents/actions/uninstall'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        filter: '{{inputs.filter}}'
        data: '{{inputs.data}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: User has insufficient permissions to perform the requested action
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
