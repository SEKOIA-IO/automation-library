uuid: 2ff4bbe9-7e35-5891-815e-563fbe1660b9
slug: '_web_api_threats_{threat_id}_notes_{note_id}_delete'
name: Delete Threats By Threat ID Notes By Note ID
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: DELETE
      url: '{{inputs.hostname}}/web/api/v2.1/threats/{{inputs.threat_id}}/notes/{{inputs.note_id}}'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Delete a threat note.
inputs:
  note_id:
    type: string
    description: 'Threat Note ID. Example: "225494730938493804".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  threat_id:
    type: string
    description: 'Threat ID. Example: "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: Threat note successfully deleted
