uuid: 30e67e9e-5329-5569-9934-c563589ca294
slug: '_web_api_users_generate-iframe-token_post'
name: Create Users Generate Iframe Token
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/generate-iframe-token'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Not enough permissions to create user.
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get a new iFrame token with the provided limitations.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      accountId:
        type: string
        description: Account id
      role:
        type: string
        description: '[DEPRECATED]Name of the role'
      roleName:
        type: string
        description: RBAC role name
      userName:
        type: string
        description: The username that will be displayed
      agentUuids:
        type: array
        items:
          type: string
        description: A list of included UUIDs
    required:
    - accountId
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          iframeToken:
            type: string
            description: User's iframe token
        required:
        - iframeToken
        description: Response data
    description: User created successfully.
