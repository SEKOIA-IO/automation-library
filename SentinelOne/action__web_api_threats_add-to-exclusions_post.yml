      limit:
        type: integer
        description: Limit
    description: Use any of the filtering options to control the list of affected
      threats. You can use any combination of filters to narrow down the list (For
      example "apply to only active threats from Linux endpoints"). You can also leave
      this field empty to apply to all available threats.
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      note:
        type: string
        description: Note
        default: null
      externalTicketId:
        type: string
        description: External ticket id
        default: null
      targetScope:
        type: string
        description: Scope to be used for Exclusions
        enum:
        - group
        - site
        - account
        - tenant
      type:
        type: string
        description: Selected Exclusion type
        enum:
        - hash
        - path
        - certificate
        - browser
        - file_type
      value:
        type: string
        description: Optional. If not provided, the relevant value from the Threat
          will be used
      description:
        type: string
        description: Description
      mode:
        type: string
        description: Exclusion mode (path exclusion only)
        enum:
        - suppress
        - suppress_dynamic_only
        - suppress_dfi_only
        - disable_in_process_monitor
        - disable_in_process_monitor_deep
        - disable_all_monitors
        - disable_all_monitors_deep
        - suppress_app_control
        - suppress_drift_detection
      pathExclusionType:
        type: string
        description: Excluded path for a path exclusion list
      actions:
        type: array
        items:
          type: string
          enum:
          - upload
          - detect
        description: Actions to perform
      macroModules:
        type: object
        properties:
          description:
            type: string
            description: Description
          hashes:
            type: array
            items:
              type: string
            description: Hashes
        description: Macro modules
    required:
    - targetScope
    - type
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          affected:
            type: integer
            description: Number of entities affected by the requested operation
          details:
            type: array
            items:
              type: object
              properties:
                threatId:
                  type: string
                  description: Threat id
                result:
                  type: string
                  description: Result of adding the threat to blocklist or exclusions
                  enum:
                  - created
                  - already_exists
                  - threat_has_no_hash
                  - unknown_failure
                  - empty_value
                  - disabled_endpoint
                  - path_value_truncated
                analystVerdict:
                  type: string
                  description: Result of changing the threat's analyst verdict as
                    part of adding the threat to blocklist or exclusions
                  enum:
                  - updated
                  - not_changed
                  - already_set
                  - conditions_not_met
                  - missing_permissions
            description: Result details for each threat
        description: Response data
    description: Added to exclusions
