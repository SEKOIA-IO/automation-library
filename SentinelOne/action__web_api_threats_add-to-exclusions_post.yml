uuid: 26a8ed47-b2f3-5806-b2d0-915cbb097d08
slug: '_web_api_threats_add-to-exclusions_post'
name: Create Threats Add To Exclusions
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/threats/add-to-exclusions'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
        filter: '{{inputs.filter}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: 'Add a threat to exclusions. The "whitening option" is required. <BR>When
  you create an exclusion, you override the "malicious" verdict of the Agent for a
  detection. This can open holes in your security deployment. Use with caution.<BR>Best
  practice: Use the most specific definition of the exclusion possible and the lowest
  mode possible.'
