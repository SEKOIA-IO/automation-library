uuid: 329d5135-6347-57c8-8d58-95233f130007
slug: '_web_api_users_login_by-api-token_post'
name: Create Users Login By API Token
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/login/by-api-token'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: User authentication failed
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Log in to the API with a token. To learn more about temporary and 6-month
  tokens and how to generate them, see https://support.sentinelone.com/hc/en-us/articles/360004195934.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      apiToken:
        type: string
        description: Api token
      reason:
        type: string
        description: When logging in from Atlas, specifies the login reason
    description: Data
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          token:
            type: string
            description: User token
          realUser:
            type: string
            description: When logging in from Atlas, specifies the actual user who
              logged in
          removedSavedScope:
            type: string
            description: Removed saved scope
          redirectTo:
            type: string
            description: Relative url to redirect to
          redirectToParams:
            type: string
            description: Query params for the redirect to, without '?' prefix
        required:
        - token
        description: Response data
    description: user logged in
