uuid: 874590d8-b683-5900-a2cc-283483ee5036
slug: '_web_api_agents_processes_get'
name: Get Agents Processes
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/agents/processes'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        ids: '{{inputs.ids}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: '[OBSOLETE] Returns empty array. To get processes of an Agent, see Applications.'
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  ids:
    type: array
    items:
      type: string
    description: 'Agent ID list. Example: "225494730938493804,225494730938493915".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: array
        items:
          type: object
          properties:
            pid:
              type: integer
              description: Process ID
            processName:
              type: string
              description: Process name
            cpuUsage:
              type: integer
              description: CPU Usage (%)
            memoryUsage:
              type: integer
              description: Memory usage (MB)
            executablePath:
              type: string
              description: Executable path
            startTime:
              type: string
              description: Start time
        description: Response data
    description: Success
