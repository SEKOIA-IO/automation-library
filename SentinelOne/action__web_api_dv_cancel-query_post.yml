uuid: 98d186b1-ed30-5bf2-bdb7-173a30dbe8a7
slug: '_web_api_dv_cancel-query_post'
name: Create Deep Visibility Cancel Query
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/dv/cancel-query'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        queryId: '{{inputs.queryId}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Stop a Deep Visibility Query by queryId. The body is {"queryID":"string_ID"}.
  Get the ID of the Deep Visibility query or Power Query from "init-query". See "Create
  Query and get QueryId".<br> Deep Visibility requires Complete SKU.
inputs:
  queryId:
    type: string
    description: QueryId obtained when creating a query under Create Query
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: string
            description: request success status
        required:
        - success
        description: Response data
    description: Success
