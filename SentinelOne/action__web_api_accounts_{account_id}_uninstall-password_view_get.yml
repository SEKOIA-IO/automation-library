uuid: cb7fd3b7-8d0e-5f66-9406-98bb3ab744f7
slug: '_web_api_accounts_{account_id}_uninstall-password_view_get'
name: Get Accounts By Account ID Uninstall Password View
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/accounts/{{inputs.account_id}}/uninstall-password/view'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Insufficient permissions
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get the uninstall password to uninstall several Agents of one Account
  with one command.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  account_id:
    type: string
    description: 'Account ID. You can get the ID from the Get accounts command. Example:
      "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          password:
            type: string
            description: 'msg EC signed with private key: v1.base64(data).base64(ES384(data)) '
        description: Response data
    description: Success
