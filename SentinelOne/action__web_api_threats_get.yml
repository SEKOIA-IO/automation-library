  sortOrder:
    type: string
    description: 'Sort direction. Example: "asc".'
    enum:
    - asc
    - desc
    default: null
  failedActions:
    type: boolean
    description: At least one action failed on the threat
  osTypes:
    type: array
    items:
      type: string
      enum:
      - windows
      - linux
      - windows_legacy
      - macos
    description: 'Included OS types. Example: "windows".'
  k8sNodeName__contains:
    type: array
    items:
      type: string
    description: Free-text filter by the endpoint Kubernetes node name (supports multiple
      values)
  tenant:
    type: boolean
    description: Indicates a tenant scope request
  signerIdentity__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by threat''s signer identity (certificate ID) (supports
      multiple values). Example: "3BDA323E552DB1FDC0A9DD871E8CADDA2FCBB419".'
  updatedAt__gt:
    type: string
    description: 'Updated at greater than. Example: "2018-02-27T04:49:26.257525Z".'
  initiatedBy:
    type: array
    items:
      type: string
      enum:
      - agent_policy
      - full_disk_scan
      - sentinelctl
      - dv_command
      - console_api
      - on_demand_scan
      - star_active
      - star_manual
      - cloud_detection
      - threat_intelligence
      - watchtower_cloud_detection
      - informational_alert_mitigation
    description: 'Only include threats from specific initiating sources. Example:
      "agent_policy,dv_command".'
  updatedAt__lt:
    type: string
    description: 'Updated at lesser than. Example: "2018-02-27T04:49:26.257525Z".'
  incidentStatuses:
    type: array
    items:
      type: string
      enum:
      - unresolved
      - in_progress
      - resolved
    description: 'Filter threats by a specific incident status. Example: "unresolved,in_progress".'
  awsSubnetIds__contains:
    type: array
    items:
      type: string
    description: Free-text filter by aws subnet ids (supports multiple values)
  agentMachineTypes:
    type: array
    items:
      type: string
      enum:
      - unknown
      - desktop
      - laptop
      - server
      - kubernetes node
      - storage
      - kubernetes pod
      - ecs task
      - kubernetes helper
    description: 'Include Agent machine types. Example: "unknown".'
  osTypesNin:
    type: array
    items:
      type: string
      enum:
      - windows
      - linux
      - windows_legacy
      - macos
    description: 'Excluded OS types. Example: "windows".'
  collectionIds:
    type: array
    items:
      type: string
    description: 'List of collection IDs to search. Example: "225494730938493804,225494730938493915".'
  cloudProviderNin:
    type: array
    items:
      type: string
    description: Exclude Agents from these cloud provider
  cloudAccount__contains:
    type: array
    items:
      type: string
    description: Free-text filter by cloud account (supports multiple values)
  mitigationStatuses:
    type: array
    items:
      type: string
      enum:
      - not_mitigated
      - mitigated
      - marked_as_benign
    description: 'Filter threats by a specific status. Example: "not_mitigated".'
outputs:
  result:
