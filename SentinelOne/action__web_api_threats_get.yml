                        description: Total
                        default: 0
                      success:
                        type: integer
                        description: Success
                        default: 0
                      failed:
                        type: integer
                        description: Failed
                        default: 0
                      pendingReboot:
                        type: integer
                        description: Pending reboot
                        default: 0
                      notFound:
