uuid: 5c28ac41-5f66-58bd-96a2-0455446a87c7
slug: '_web_api_accounts_{account_id}_uninstall-password_metadata_get'
name: Get Accounts By Account ID Uninstall Password Metadata
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/accounts/{{inputs.account_id}}/uninstall-password/metadata'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Insufficient permissions
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get the uninstall password metadata, such as which user created and revoked
  it and when.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  account_id:
    type: string
    description: 'Account ID. You can get the ID from the Get accounts command. Example:
      "225494730938493804".'
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          expiration:
            type: string
            description: 'password expiration date format: yyyy-mm-dd'
          version:
            type: integer
            description: Version
          createdAt:
            type: string
            description: 'password creation date: yyyy-mm-dd'
          lastRevoked:
            type: string
            description: uninstall password last revoked date
          revokedById:
            type: integer
            description: The ID of the user that revoked the uninstall password
          revokedByName:
            type: string
            description: Revoked by name
          generatedById:
            type: integer
            description: The ID of the user that generated the uninstall password
          generatedByName:
            type: string
            description: name of the user that generated the uninstall password
        required:
        - generatedByName
        - lastRevoked
        - revokedByName
        - version
        description: Response data
    description: Success
