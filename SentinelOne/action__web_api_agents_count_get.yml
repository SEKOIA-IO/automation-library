description: Get the count of Agents that match a filter. This command is useful to
  run before you run other commands. You will be able to manage Agent maintenance
  better if you know how many Agents will get a command that takes time (such as Update
  Software).
inputs:
  accountIds:
    type: array
    items:
      type: string
    description: 'List of Account IDs to filter by. Example: "225494730938493804,225494730938493915".'
  uuid__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by Agent UUID (supports multiple values). Example:
      "e92-01928,b055".'
  coreCount__gt:
    type: integer
    description: CPU cores (more than)
  uuid:
    type: string
    description: 'Agent''s universally unique identifier. Example: "ff819e70af13be381993075eb0ce5f2f6de05be2".'
  externalIp__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by visible IP (supports multiple values). Example:
      "205,127.0".'
  missingPermissionsNin:
    type: array
    items:
      type: string
      enum:
      - user_action_needed_fda
      - user_action_needed_rs_fda
      - user_action_needed_fda_helper
      - user_action_needed_fda_sentineld
      - user_action_needed_bluetooth_per
      - user_action_needed_network
      - user_action_needed_notifications
    description: 'Excluded missing permissions. Example: "user_action_needed_bluetooth_per,user_action_needed_fda_helper".'
  agentOperatingModesNin:
    type: array
    items:
      type: string
      enum:
      - optimized
      - standard
    description: 'Agent operating mode nin. Example: "optimized".'
  gcpServiceAccount__contains:
    type: array
    items:
      type: string
    description: Free-text filter by gcp service account (supports multiple values)
  adQuery:
    type: string
    description: 'An Active Directory query string. Example: "CN=Managers,DC=sentinelone,DC=com".'
  computerNameOrUuid__contains:
    type: array
    items:
      type: string
    description: Free-text filter by computer name or uuid (supports multiple values)
  computerName__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by computer name (supports multiple values). Example:
      "john-office,WIN".'
  threatCreatedAt__gt:
    type: string
    description: 'Agents with threats reported after this time. Example: "2018-02-27T04:49:26.257525Z".'
  appsVulnerabilityStatuses:
    type: array
    items:
      type: string
      enum:
      - patch_required
      - up_to_date
      - not_applicable
    description: 'Apps vulnerability status in. Example: "patch_required".'
  hasTags:
    type: boolean
    description: Include only Agents that have any tags assigned if True, or none
      if False
  ecsTaskAvailabilityZone__contains:
    type: array
    items:
      type: string
    description: Free-text filter by ECS task availability zone
  remoteProfilingStatesNin:
    type: array
    items:
      type: string
    description: Do not include these Agent remote profiling states
  threatCreatedAt__between:
    type: string
    description: 'Agents with threats reported in a date range (format: <from_timestamp>-<to_timestamp>,
      inclusive). Example: "1514978764288-1514978999999".'
  totalMemory__gt:
    type: integer
    description: Memory size (MB, more than)
  isEventSearchProxyEnabled:
    type: array
    items:
      type: string
    description: Include only Agents using event search proxy. Accepts true, false,
      or none (for not reported).
  lastActiveDate__gte:
    type: string
    description: 'Agents last active after or at this time. Example: "2018-02-27T04:49:26.257525Z".'
  idsNin:
    type: array
    items:
      type: string
    description: 'Excluded Agent IDs. Example: "225494730938493804,225494730938493915".'
  adQuery__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by Active Directory string (supports multiple values).
      Example: "DC=sentinelone".'
  agentVersionsNin:
    type: array
    items:
      type: string
    description: 'Agent versions not to include. Example: "2.0.0.0,2.1.5.144".'
  infected:
    type: boolean
    description: Include only Agents with at least one active threat
  ecsTaskArn__contains:
    type: array
    items:
      type: string
    description: Free-text filter by ECS task arn
  userActionsNeeded:
    type: array
    items:
      type: string
      enum:
      - none
      - user_action_needed
      - reboot_needed
      - upgrade_needed
      - incompatible_os
      - unprotected
      - rebootless_without_dynamic_detection
      - extended_exclusions_partially_accepted
      - reboot_required
      - pending_deprecation
      - ne_not_running
      - ne_cf_not_active
      - pending_performance_insights
      - prompt_security_certificate_missing
      - prompt_security_certificate_expired
      - reboot_category
      - missing_permissions_category
      - agent_suppressed_category
      - incompatible_os_category
      - unprotected_category
      - partial_functionality
      - performance_insights
    description: 'Included pending user actions. Example: "reboot_needed,upgrade_needed".'
  isActive:
    type: array
    items:
      type: boolean
    description: Include only active Agents
  operationalStatesNin:
    type: array
    items:
      type: string
    description: Do not include these Agent operational states
  networkQuarantineEnabled:
    type: array
    items:
      type: boolean
    description: The agents supports Network Quarantine Control and its enabled for
      the agent's group
  proxyMethodNin:
    type: array
    items:
      type: string
    description: 'Exclude by proxy method: Auto, System, User, Custom, None, Not Reported.
      Example: "Not Reported,None,Auto,System,User,Custom".'
  networkInterfaceGatewayMacAddress__contains:
    type: array
    items:
      type: string
    description: 'Free-text filter by Gateway MAC address (supports multiple values).
      Example: "aa:0f,:41:".'
  cloudNetwork__contains:
    type: array
    items:
      type: string
    description: Free-text filter by cloud network (supports multiple values)
  ecsServiceName__contains:
    type: array
    items:
      type: string
    description: Free-text filter by ECS service name
  createdAt__gte:
    type: string
    description: 'Agents created after or at this timestamp. Example: "2018-02-27T04:49:26.257525Z".'
  liveUpdateId__contains:
    type: array
    items:
      type: string
    description: Free-text filter by live update ID (supports multiple values)
  computerName:
    type: string
    description: 'Computer name. Example: "My Office Desktop".'
  threatCreatedAt__lte:
    type: string
    description: 'Agents with threats reported before or at this time. Example: "2018-02-27T04:49:26.257525Z".'
  ecsTaskDefinitionArn__contains:
    type: array
    items:
      type: string
    description: Free-text filter by ECS task definition arn
  machineTypes:
    type: array
    items:
      type: string
      enum:
      - unknown
      - desktop
      - laptop
      - server
      - kubernetes node
      - storage
      - kubernetes pod
      - ecs task
      - kubernetes helper
    description: 'Included machine types. Example: "laptop,desktop".'
  registeredAt__between:
    type: string
    description: 'Date range for first registration time (format: <from_timestamp>-<to_timestamp>,
      inclusive). Example: "1514978764288-1514978999999".'
  scanStatuses:
    type: array
    items:
      type: string
      enum:
      - none
      - started
      - aborted
      - finished
    description: 'Included scan statuses. Example: "started,aborted".'
  registeredAt__lte:
    type: string
    description: 'Agents registered before or at this time. Example: "2018-02-27T04:49:26.257525Z".'
  lastSuccessfulScanDate__gt:
    type: string
    description: 'Agents last successful full disk scan after this time. Example:
      "2018-02-27T04:49:26.257525Z".'
  agentOperatingModes:
    type: array
    items:
      type: string
      enum:
      - optimized
      - standard
    description: 'Agent operating mode in. Example: "optimized".'
  registeredAt__lt:
    type: string
    description: 'Agents registered before this time. Example: "2018-02-27T04:49:26.257525Z".'
  installerTypesNin:
    type: array
    items:
      type: string
      enum:
      - .msi
      - .exe
      - .deb
      - .rpm
      - .bsx
      - .pkg
      - .img
      - unknown
      - .tar
      - .zip
      - .gz
      - .xz
    description: 'Exclude Agents installed with these package types. Example: ".msi".'
  totalMemory__between:
    type: string
    description: 'Total memory range (GB, inclusive). Example: "4-8".'
  locationIds:
    type: array
    items:
      type: string
    description: 'Include only Agents reporting these locations. Example: "225494730938493804,225494730938493915".'
  agentVersion__lt:
    type: string
    description: 'Agents versions less than given version. Example: "2.5.1.1320".'
  rangerVersions:
    type: array
    items:
      type: string
    description: 'Network Scanner versions to include. Example: "2.0.0.0,2.1.5.144".'
  createdAt__lt:
    type: string
    description: 'Agents created before this timestamp. Example: "2018-02-27T04:49:26.257525Z".'
  domainsNin:
    type: array
    items:
      type: string
    description: 'Not included network domains. Example: "mybusiness.net,workgroup".'
  rangerVersionsNin:
    type: array
    items:
      type: string
    description: 'Network Scanner versions not to include. Example: "2.0.0.0,2.1.5.144".'
  cloudInstanceId__contains:
    type: array
    items:
      type: string
    description: Free-text filter by cloud instance id(supports multiple values)
  cpuCount__lt:
    type: integer
    description: Number of CPUs (less than)
  decommissionedAt__gte:
    type: string
    description: 'Agents decommissioned after or at this timestamp. Example: "2018-02-27T04:49:26.257525Z".'
  query:
    type: string
    description: 'A free-text search term, will match applicable attributes (sub-string
      match). Note: Device''s physical addresses will be matched if they start with
      the search term only (no match if they contain the term). Example: "Linux".'
  cloudImage__contains:
    type: array
    items:
      type: string
    description: Free-text filter by cloud image (supports multiple values)
  threatContentHash:
    type: string
    description: 'Include only Agents that have at least one threat with this content
