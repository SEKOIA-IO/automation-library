  threatCreatedAt__gte:
    type: string
    description: 'Agents with threats reported after or at this time. Example: "2018-02-27T04:49:26.257525Z".'
  csvFilterId:
    type: string
    description: 'The ID of the CSV file to filter by. Example: "225494730938493804".'
  decommissionedAt__between:
    type: string
    description: 'Date range for decommission time (format: <from_timestamp>-<to_timestamp>,
      inclusive). Example: "1514978890136-1514978650130".'
  agentVersion__between:
    type: string
    description: 'Version range for agent version (format: <from_version>-<to_version>,
      inclusive). Example: "2.0.0.0-2.1.5.144".'
  createdAt__between:
    type: string
    description: 'Date range for creation time (format: <from_timestamp>-<to_timestamp>,
      inclusive). Example: "1514978890136-1514978650130".'
  createdAt__gt:
    type: string
    description: 'Agents created after this timestamp. Example: "2018-02-27T04:49:26.257525Z".'
  updatedAt__lte:
    type: string
    description: 'Agents updated before or at this timestamp. Example: "2018-02-27T04:49:26.257525Z".'
  lastSuccessfulScanDate__lte:
    type: string
    description: 'Agents last successful full disk scan before or at this time. Example:
      "2018-02-27T04:49:26.257525Z".'
  lastSuccessfulScanDate__lt:
    type: string
    description: 'Agents last successful full disk scan before this time. Example:
      "2018-02-27T04:49:26.257525Z".'
  locationEnabled:
    type: array
    items:
      type: boolean
    description: The agents supports Location Awareness and it is enabled for the
