uuid: 60364b0f-fa5e-5a05-987b-42e47ab16ee0
slug: '_web_api_accounts_{account_id}_put'
name: Update Accounts By Account ID
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: PUT
      url: '{{inputs.hostname}}/web/api/v2.1/accounts/{{inputs.account_id}}'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        data: '{{inputs.data}}'
    asserts:
      error_404:
        predicate: '{{response.status_code != 404}}'
        fail: Account not found
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: 'Change the data of an Account. This command requires a Global user or
  an Account user and Admin role. Use this command to change the name, ID, SKUs and
  how they are distributed among Sites and Agents, and more. (See the Body sample.)
  Best practice:  Consult with your SentinelOne SE.'
