uuid: 4e016909-d4ef-57f4-9c1b-7bb3530604d9
slug: '_web_api_accounts_get'
name: Get Accounts
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/accounts'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        skip: '{{inputs.skip}}'
        limit: '{{inputs.limit}}'
        cursor: '{{inputs.cursor}}'
        countOnly: '{{inputs.countOnly}}'
        skipCount: '{{inputs.skipCount}}'
        sortBy: '{{inputs.sortBy}}'
        sortOrder: '{{inputs.sortOrder}}'
        ids: '{{inputs.ids}}'
        accountIds: '{{inputs.accountIds}}'
        query: '{{inputs.query}}'
        name: '{{inputs.name}}'
        isDefault: '{{inputs.isDefault}}'
        accountType: '{{inputs.accountType}}'
        expiration: '{{inputs.expiration}}'
        totalLicenses: '{{inputs.totalLicenses}}'
        activeLicenses: '{{inputs.activeLicenses}}'
        sku: '{{inputs.sku}}'
        module: '{{inputs.module}}'
        createdAt: '{{inputs.createdAt}}'
        updatedAt: '{{inputs.updatedAt}}'
        state: '{{inputs.state}}'
        states: '{{inputs.states}}'
        statesNin: '{{inputs.statesNin}}'
        features: '{{inputs.features}}'
        usageType: '{{inputs.usageType}}'
        billingMode: '{{inputs.billingMode}}'
        name__contains: '{{inputs.name__contains}}'
    asserts:
      error_403:
        predicate: '{{response.status_code != 403}}'
        fail: Insufficient permissions
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get the Accounts, and their data, that match the filter. This command
  gives the Account IDs, which other commands require. <br>Accounts are created by
  a Global User or by SentinelOne. Each Account contains Sites, which can inherit
  assets and settings. Each Account has one or more SKUs, that you assign to the Sites.
  To have both Core and Complete Sites in an Account, the Account must have both SKUs.
inputs:
  activeLicenses:
    type: integer
    description: Active licenses
  isDefault:
    type: boolean
    description: Is default
  cursor:
    type: string
    description: 'Cursor position returned by the last request. Use to iterate over
      more than 1000 items. Example: "YWdlbnRfaWQ6NTgwMjkzODE=".'
    default: null
  sortOrder:
    type: string
    description: 'Sort direction. Example: "asc".'
    enum:
    - asc
    - desc
    default: null
  ids:
    type: array
    items:
      type: string
    description: 'A list of Account IDs. Example: "225494730938493804,225494730938493915".'
  accountIds:
    type: array
    items:
      type: string
    description: 'List of Account IDs to search for. Example: "225494730938493804,225494730938493915".'
  query:
    type: string
    description: 'Full text search for fields: name. (Note: on single-Account Consoles,
      the Account name will not be matched)'
  state:
    type: string
    description: 'Account state. Example: "active".'
    enum:
    - active
    - expired
    - deleted
  accountType:
    type: string
    description: 'Account type. Example: "Trial".'
    enum:
    - Trial
    - Paid
  hostname:
    type: string
    description: Base URL for the API
  countOnly:
    type: boolean
    description: If true, only total number of items will be returned, without any
      of the actual objects.
    default: false
  createdAt:
    type: string
    description: 'Timestamp of Account creation. Example: "2018-02-27T04:49:26.257525Z".'
  expiration:
    type: string
    description: 'Expiration. Example: "2018-02-27T04:49:26.257525Z".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  limit:
    type: integer
    description: 'Limit number of returned items (1-1000). Example: "10".'
    default: 10
  updatedAt:
    type: string
    description: 'Timestamp of last update. Example: "2018-02-27T04:49:26.257525Z".'
  billingMode:
    type: string
    description: 'Billing mode. Example: "subscription".'
    enum:
    - subscription
    - consumption
  name:
    type: string
    description: 'Name. Example: "My Account".'
  sortBy:
    type: string
    description: 'The column to sort the results by. Example: "id".'
    enum:
    - id
    - name
    - totalLicenses
    - expiration
    - accountType
    - state
    - createdAt
    - updatedAt
    - activeLicenses
    - activeAgents
    - numberOfSites
    - usageType
    - billingMode
    default: null
  totalLicenses:
    type: integer
    description: Total licenses
  features:
    type: array
    items:
      type: string
      enum:
      - firewall-control
      - device-control
      - ioc
    description: 'Filter the list of Accounts for those that support this feature.
      Example: "firewall-control".'
  skipCount:
    type: boolean
    description: If true, total number of items will not be calculated, which speeds
      up execution time.
    default: null
  sku:
    type: string
    description: 'Sku. Example: "core".'
  skip:
    type: integer
    description: 'Skip first number of items (0-1000). To iterate over more than 1000
      items,  use "cursor". Example: "150".'
    default: null
  statesNin:
    type: array
    items:
      type: string
    description: List of states to not filter
  usageType:
    type: string
    description: 'Usage type. Example: "customer".'
    enum:
    - customer
    - mssp
    - ir
  states:
    type: array
    items:
      type: string
    description: Filter by state, such as active or expired.
  name__contains:
    type: array
    items:
      type: string
    description: Free-text filter by account name (supports multiple values)
  module:
    type: string
    description: 'Module. Example: "star,rso".'
outputs:
  result:
    type: object
    properties:
      pagination:
        type: object
        properties:
          nextCursor:
            type: string
            description: Pass this value as "cursor" on your next request, to get
              the next page of results (Will be "null" when last page reached)
            default: null
          totalItems:
            type: integer
            description: Total number of items found matching your query
        required:
        - totalItems
        description: Pagination information
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Account ID
            name:
              type: string
              description: Name
            isDefault:
              type: boolean
              description: Is default
            accountType:
              type: string
              description: Account type
            expiration:
              type: string
              description: Expiration
            salesforceId:
              type: string
            externalId:
              type: string
              description: ID of CRM external system
            state:
              type: string
              description: Account state
              enum:
              - active
              - expired
              - deleted
            createdAt:
              type: string
              description: Timestamp of Account creation
            updatedAt:
              type: string
              description: Timestamp of last update
            unlimitedExpiration:
              type: boolean
              description: The Account does not expire
            activeAgents:
              type: integer
              description: Total Agents in the Account
            skus:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: The suite of product features active for this account
                    enum:
                    - Core
                    - Control
                    - Complete
                  totalLicenses:
                    type: integer
                    description: Number of licenses for this specific SKU. Applicable
                      only if unlimited is False
                  unlimited:
                    type: boolean
                    description: True if this is an unlimited SKU.
                  agentsInSku:
                    type: integer
                    description: Total agents commissioned in this SKU.
              description: '[DEPRECATED] The list of SKUs for the Account.'
            licenses:
              type: object
              properties:
                bundles:
                  type: array
                  items:
                    type: object
                    properties:
                      displayName:
                        type: string
                        description: The Bundle display name
                      majorVersion:
                        type: integer
                        description: The Bundle major version
                      minorVersion:
                        type: integer
                        description: The Bundle minor version
                      name:
                        type: string
                        description: The Bundle internal api name
                      surfaces:
                        type: array
                        items:
                          type: object
                          properties:
                            count:
                              type: integer
                              description: The Surface count. -1 indicates unlimited
                                count
                            name:
                              type: string
                              description: The Surface name.
                        description: The Surfaces in the Bundle
                      totalSurfaces:
                        type: integer
                        description: The total number of Surfaces in this Bundle.
                          -1 indicates unlimited count.
                  description: The licenses Bundles
                modules:
                  type: array
                  items:
                    type: object
                    properties:
                      displayName:
                        type: string
                        description: The Add-on display name
                      majorVersion:
                        type: integer
                        description: The Add-on major version
                      name:
                        type: string
                        description: The Add-on internal api name
                  description: The licenses Add-ons
                settings:
                  type: array
                  items:
                    type: object
                    properties:
                      displayName:
                        type: string
                        description: '[DEPRECATED] The Setting display name'
                      settingGroup:
                        type: string
                        description: '[DEPRECATED] The Setting group name'
                      settingGroupDisplayName:
                        type: string
                        description: The Setting group display name
                      groupName:
                        type: string
                        description: The Setting group name
                      setting:
                        type: string
                        description: The Setting display name
                  description: The licenses Settings
              description: The account licenses.
            totalLicenses:
              type: integer
              description: The total number of licenses on all Surfaces for all Bundles.
            usageType:
              type: string
              description: Usage type
              enum:
              - customer
              - mssp
              - ir
            billingMode:
              type: string
              description: Billing mode
              enum:
              - subscription
              - consumption
            irFields:
              type: object
              properties:
                companyName:
                  type: string
                  description: The customer's company name
                contactFirstName:
                  type: string
                  description: First name of the customer contact
                contactLastName:
                  type: string
                  description: Last name of the customer contact
                contactEmail:
                  type: string
                  description: Business email of the customer contact. Must not match
                    the IR partner domain, the submitter's own domain, or a free/personal
                    email provider (e.g. Gmail, Yahoo, Hotmail)
                  pattern: (^[-!#$%&'*+/=?^_`{}|~0-9A-Z]+(\.[-!#$%&'*+/=?^_`{}|~0-9A-Z]+)*|^"([\001-\010\013\014\016-\037!#-\[\]-\177]|\\[\001-011\013\014\016-\177])*")@(?:[A-Z0-9](?:[A-Z0-9(-|_).]{0,259}[A-Z0-9])?)$
                region:
                  type: string
                  description: State or region within the country
                country:
                  type: string
                  description: Country of the customer
                city:
                  type: string
                  description: City of the customer
                postal:
                  type: string
                  description: Postal / ZIP code of the customer
                numberOfEmployeesEndpoints:
                  type: integer
                  description: Estimated number of employees or endpoints at the customer
                industry:
                  type: string
                  description: Industry vertical of the customer
                  enum:
                  - Education
                  - Government (Central/Federal)
                  - Government (Local)
                  - Healthcare (Provider)
                  - Other
              required:
              - companyName
              - contactEmail
              - contactFirstName
              - contactLastName
              - country
              - industry
              - numberOfEmployeesEndpoints
              description: Ir fields
            promptFields:
              type: object
              properties:
                promptRegion:
                  type: string
                  description: Region associated with the prompt
                  enum:
                  - useast
                  - eunorth
                  - apsouth
                  - apsoutheast
                  - null
                promptTenantName:
                  type: string
                  description: Tenant name associated with the prompt
                promptUserEmail:
                  type: string
                  description: Email of the user associated with the prompt
                  pattern: (^[-!#$%&'*+/=?^_`{}|~0-9A-Z]+(\.[-!#$%&'*+/=?^_`{}|~0-9A-Z]+)*|^"([\001-\010\013\014\016-\037!#-\[\]-\177]|\\[\001-011\013\014\016-\177])*")@(?:[A-Z0-9](?:[A-Z0-9(-|_).]{0,259}[A-Z0-9])?)$
                promptUserName:
                  type: string
                  description: Name of the user associated with the prompt
                promptUsers:
                  type: array
                  items:
                    type: object
                    properties:
                      promptUserName:
                        type: string
                        description: Name of the additional Prompt tenant user
                      promptUserEmail:
                        type: string
                        description: Email of the additional Prompt tenant user
                        pattern: (^[-!#$%&'*+/=?^_`{}|~0-9A-Z]+(\.[-!#$%&'*+/=?^_`{}|~0-9A-Z]+)*|^"([\001-\010\013\014\016-\037!#-\[\]-\177]|\\[\001-011\013\014\016-\177])*")@(?:[A-Z0-9](?:[A-Z0-9(-|_).]{0,259}[A-Z0-9])?)$
                    required:
                    - promptUserEmail
                    - promptUserName
                  description: Prompt tenant users (used instead of the single prompt
                    user fields once multi-user provisioning is enabled). Limited
                    to 10 entries.
              description: Prompt fields
            makeSocDefaultUi:
              type: boolean
              description: True if SOC is to be enabled by default
            creator:
              type: string
              description: The user that created the group
            creatorId:
              type: string
              description: The ID of the user that created the group
            numberOfSites:
              type: integer
              description: Total number of Sites in this Account
            coreSites:
              type: integer
              description: '[DEPRECATED] Number of Sites in suite Core'
            controlSites:
              type: integer
              description: '[DEPRECATED] Number of Sites in suite Control'
            completeSites:
              type: integer
              description: '[DEPRECATED] Number of Sites in suite Complete'
            totalCore:
              type: integer
              description: '[DEPRECATED] Total Number of Core licenses'
            totalControl:
              type: integer
              description: '[DEPRECATED] Total Number of Control licenses'
            totalComplete:
              type: integer
              description: '[DEPRECATED] Total Number of Complete licenses'
            unlimitedCore:
              type: boolean
              description: '[DEPRECATED] True if Core licenses count is unlimited'
            unlimitedControl:
              type: boolean
              description: '[DEPRECATED] True if Control licenses count is unlimited'
            unlimitedComplete:
              type: boolean
              description: '[DEPRECATED] True if Complete licenses count is unlimited'
            agentsInCoreSku:
              type: integer
              description: '[DEPRECATED] Number of Agents connected to a Core site'
            agentsInControlSku:
              type: integer
              description: '[DEPRECATED] Number of Agents connected to a Control site'
            agentsInCompleteSku:
              type: integer
              description: '[DEPRECATED] Number of Agents connected to a Complete
                site'
        description: Response data
    required:
    - pagination
    description: Success
