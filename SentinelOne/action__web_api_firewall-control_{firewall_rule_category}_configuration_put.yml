uuid: cca07e5b-8785-5cf5-b403-15562d5c33dd
slug: '_web_api_firewall-control_{firewall_rule_category}_configuration_put'
name: Update Firewall Control By Firewall Rule Category Configuration
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: PUT
      url: '{{inputs.hostname}}/web/api/v2.1/firewall-control/{{inputs.firewall_rule_category}}/configuration'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        filter: '{{inputs.filter}}'
        data: '{{inputs.data}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Change the Firewall Control configuration for a given scope.  <br>To
  get the ID of a scope, run "accounts", "sites", or "groups". To change the Global
  configuration, leave the filters empty and set "tenant" to "true". In the Body,
  you can set if Firewall Control is enabled for the scope, if Location Awareness
  is enabled, the higher scope from which this scope inherits the configuration ("Global"
  or a scope ID), whether the lower scopes inherit this configuration, and whether
  blocked actions are reported.<br>Firewall Control requires Control SKU.
inputs:
  filter:
    type: object
    properties:
      accountIds:
        type: array
        items:
          type: string
        description: List of Account IDs to filter by
      siteIds:
        type: array
        items:
          type: string
        description: List of Site IDs to filter by
      groupIds:
        type: array
        items:
          type: string
        description: List of Group IDs to filter by
      tenant:
        type: boolean
        description: Indicates a tenant scope request
    description: Filter
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  data:
    type: object
    properties:
      enabled:
        type: boolean
        description: Firewall control enabled for the scope
      locationAware:
        type: boolean
        description: Firewall control supports location awareness for the scope
      reportBlocked:
        type: boolean
        description: Agent should report blocked events
      inherits:
        type: boolean
        description: True if rules are decoupled from parent rules
      inheritedFrom:
        type: string
        description: If null it means it is own policy else it tells the ancestor
          for the policy.For groups options are null/Site/Global, for site options
          are null/Global.
      selectedTags:
        type: array
        items:
          type: string
          description: List of enabled tag IDs
        description: Selected tags
      inheritSettings:
        type: boolean
        description: Inherit firewall settings from parent scope
      inheritAllFirewallRules:
        type: boolean
        description: Inherit all the rules and tags from the parent scope. Expands
          on 'inherits' value.
    description: Data
  firewall_rule_category:
    type: string
    description: To affect Network Quarantine use network-quarantine
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          enabled:
            type: boolean
            description: Firewall control enabled for the scope
          locationAware:
            type: boolean
            description: Firewall control supports location awareness for the scope
          reportBlocked:
            type: boolean
            description: Agent should report blocked events
          inherits:
            type: boolean
            description: True if rules are decoupled from parent rules
          inheritedFrom:
            type: string
            description: If null it means it is own policy else it tells the ancestor
              for the policy.For groups options are null/Site/Global, for site options
              are null/Global.
          selectedTags:
            type: array
            items:
              type: string
              description: List of enabled tag IDs
            description: Selected tags
          inheritSettings:
            type: boolean
            description: Inherit firewall settings from parent scope
          inheritAllFirewallRules:
            type: boolean
            description: Inherit all the rules and tags from the parent scope. Expands
              on 'inherits' value.
        description: Response data
    description: Success
