uuid: 13feaebc-47a6-5690-95d5-6b600e28505b
slug: '_web_api_users_auth_eula_post'
name: Create Users Auth EULA
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/auth/eula'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Mark the End User License Agreement (EULA) as signed for user scopes.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          success:
            type: boolean
            description: Indicates a successful operation
        description: Response data
    description: Authenticated
