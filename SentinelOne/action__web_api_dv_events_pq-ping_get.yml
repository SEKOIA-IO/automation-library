uuid: 535dba42-406e-53a8-98cf-e468be39c9ac
slug: '_web_api_dv_events_pq-ping_get'
name: Get Deep Visibility Events PQ Ping
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/dv/events/pq-ping'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        queryId: '{{inputs.queryId}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Ping a Deep Visibility Power Query using the queryId if results have
  not returned from an initial Power Query or a previous ping.<br>Use pq-ping soon
  after initiating a Power Query via the /web/api/v2.1/dv/events/pq endpoint. <br>It
  is recommended to create a script that initiates the Power Query and then pings
  the query every few seconds to check the status and retrieve results when they are
  ready. <br>If the ping is run after a significant delay, it may result in a 503
  Service Unavailable response. This indicates that the results are no longer available
  due to cache eviction.
inputs:
  queryId:
    type: string
    description: QueryId query param
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          queryId:
            type: string
            description: Query Id
          externalId:
            type: string
            description: External Query Id
          status:
            type: string
            description: Status
            enum:
            - PROCESS_RUNNING
            - EVENTS_RUNNING
            - FAILED
            - FAILED_CLIENT
            - FINISHED
            - RUNNING
            - ERROR
            - QUERY_CANCELLED
            - TIMED_OUT
            - QUERY_EXPIRED
          progress:
            type: integer
            description: Query loading status in percentage
          columns:
            type: array
            items:
              type: object
            description: includes the name of the column and its type
          data:
            type: array
            items:
              type: array
            description: Includes actual searched data
          recommendations:
            type: array
            items:
              type: string
            description: possible action items to improve query results
        required:
        - progress
        - queryId
        - status
        description: Response data
    description: Success
