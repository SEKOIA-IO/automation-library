      url: '{{inputs.hostname}}/web/api/v2.1/users'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        skip: '{{inputs.skip}}'
        limit: '{{inputs.limit}}'
        cursor: '{{inputs.cursor}}'
        countOnly: '{{inputs.countOnly}}'
        skipCount: '{{inputs.skipCount}}'
        sortBy: '{{inputs.sortBy}}'
        sortOrder: '{{inputs.sortOrder}}'
        siteIds: '{{inputs.siteIds}}'
        accountIds: '{{inputs.accountIds}}'
        source: '{{inputs.source}}'
        sources: '{{inputs.sources}}'
        email: '{{inputs.email}}'
        email__contains: '{{inputs.email__contains}}'
        emailReadOnly: '{{inputs.emailReadOnly}}'
        fullName: '{{inputs.fullName}}'
        fullName__contains: '{{inputs.fullName__contains}}'
        fullNameReadOnly: '{{inputs.fullNameReadOnly}}'
        firstLogin: '{{inputs.firstLogin}}'
        lastLogin: '{{inputs.lastLogin}}'
        dateJoined: '{{inputs.dateJoined}}'
        groupsReadOnly: '{{inputs.groupsReadOnly}}'
        twoFaEnabled: '{{inputs.twoFaEnabled}}'
        primaryTwoFaMethod: '{{inputs.primaryTwoFaMethod}}'
        emailVerified: '{{inputs.emailVerified}}'
        query: '{{inputs.query}}'
        ids: '{{inputs.ids}}'
        roleIds: '{{inputs.roleIds}}'
        twoFaStatus: '{{inputs.twoFaStatus}}'
        twoFaStatuses: '{{inputs.twoFaStatuses}}'
        canGenerateApiToken: '{{inputs.canGenerateApiToken}}'
        hasValidApiToken: '{{inputs.hasValidApiToken}}'
        lastActivation__lt: '{{inputs.lastActivation__lt}}'
        lastActivation__lte: '{{inputs.lastActivation__lte}}'
        lastActivation__gt: '{{inputs.lastActivation__gt}}'
        lastActivation__gte: '{{inputs.lastActivation__gte}}'
        lastActivation__between: '{{inputs.lastActivation__between}}'
        apiTokenExpiresAt__lt: '{{inputs.apiTokenExpiresAt__lt}}'
        apiTokenExpiresAt__lte: '{{inputs.apiTokenExpiresAt__lte}}'
        apiTokenExpiresAt__gt: '{{inputs.apiTokenExpiresAt__gt}}'
        apiTokenExpiresAt__gte: '{{inputs.apiTokenExpiresAt__gte}}'
        apiTokenExpiresAt__between: '{{inputs.apiTokenExpiresAt__between}}'
        createdAt__lt: '{{inputs.createdAt__lt}}'
        createdAt__lte: '{{inputs.createdAt__lte}}'
        createdAt__gt: '{{inputs.createdAt__gt}}'
        createdAt__gte: '{{inputs.createdAt__gte}}'
        createdAt__between: '{{inputs.createdAt__between}}'
    asserts:
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get a list of users.
