uuid: 8cdb961c-2746-5bd8-b099-085000a96e6f
slug: '_web_api_cloud-detection_rules_entity-mapping-options_get'
name: Get Cloud Detection Rules Entity Mapping Options
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/cloud-detection/rules/entity-mapping-options'
      headers:
        Authorization: '{{inputs.api_token}}'
    asserts:
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get available entity mapping options. Returns valid identifier types
  for asset lookup routing.
inputs:
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          identifierTypes:
            type: array
            items:
              type: object
            description: Grouped identifier type values for entity mapping lookup
              routing.
        description: Response data
    description: Success
