uuid: 0b02a98a-356a-5683-8820-3baee85eab2f
slug: '_web_api_users_request-app_post'
name: Create Users Request App
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: POST
      url: '{{inputs.hostname}}/web/api/v2.1/users/request-app'
      headers:
        Authorization: '{{inputs.api_token}}'
      json:
        currentPassword: '{{inputs.currentPassword}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Request 2FA App response.
inputs:
  currentPassword:
    type: string
    description: User password
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  hostname:
    type: string
    description: Base URL for the API
outputs:
  result:
    type: object
    properties:
      errors:
        type: array
        items:
          type: object
        description: Errors
      data:
        type: object
        properties:
          qrCode:
            type: string
            description: Qr code
          code:
            type: string
            description: Code
        description: Response data
    description: Success
