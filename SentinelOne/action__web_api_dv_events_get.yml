uuid: 228f09e9-2adf-5eab-84b4-0c5cf99e4965
slug: '_web_api_dv_events_get'
name: Get Deep Visibility Events
pipeline:
- name: http
- name: output
stages:
  http:
    kind: http
    properties:
      method: GET
      url: '{{inputs.hostname}}/web/api/v2.1/dv/events'
      headers:
        Authorization: '{{inputs.api_token}}'
      params:
        skip: '{{inputs.skip}}'
        limit: '{{inputs.limit}}'
        cursor: '{{inputs.cursor}}'
        subQuery: '{{inputs.subQuery}}'
        queryId: '{{inputs.queryId}}'
        sortBy: '{{inputs.sortBy}}'
        sortOrder: '{{inputs.sortOrder}}'
    asserts:
      error_400:
        predicate: '{{response.status_code != 400}}'
        fail: Invalid user input received. See error details for further information.
      error_401:
        predicate: '{{response.status_code != 401}}'
        fail: Unauthorized access - please sign in and retry.
      success:
        predicate: '{{response.status_code == 200}}'
        fail: Expected a successful (2xx) status code, got {{response.status_code}}
    captures:
      result: '{{response.json}}'
  output:
    kind: output
    properties:
      result: '{{http.result}}'
description: Get all Deep Visibility events from a queryId. You can use this command
  to send a sub-query, a new query to run on these events. Get the ID from "init-query".
  See "Create Query and get QueryId". <br>For complete documentation, see Query Syntax
  in the Knowledge Base (support.sentinelone.com) or the Console Help.
inputs:
  sortBy:
    type: string
    description: 'Events sorted by field. Example: "createdAt".'
  queryId:
    type: string
    description: 'QueryId obtained when creating a query under Create Query. Example:
      "q1xx2xx3".'
  api_token:
    type: string
    description: The value of the Authorization header
    secret: true
  limit:
    type: integer
    description: 'Limit number of returned items (1-1000). Example: "10".'
    default: 10
  cursor:
    type: string
    description: Cursor position returned by the last request. Should be used instead
      of skip. cursor currently supports sort by with createdAt, pid, processStartTime
    default: null
  sortOrder:
    type: string
    description: 'Event sorting order. Example: "asc".'
    enum:
    - asc
    - desc
    default: null
  subQuery:
    type: string
    description: Create a sub query to run on the data that was already pulled
  skip:
    type: integer
    description: 'Skip first number of items (0-1000). To iterate over more than 1000
      items,  use "cursor". Example: "150".'
    default: null
  hostname:
    type: string
    description: Base URL for the API
