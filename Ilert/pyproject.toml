[project]
name = "automation-module-ilert"
description = ""
version = "0.0"
authors = []
requires-python = ">=3.14,<4"
dependencies = [
	"requests>=2.0,<3",
	"sekoia-automation-sdk>=1.23.1,<2",
]

[dependency-groups]
dev = [
	"pytest>=9.0.3,<10",
	"pytest-cov>=7.0.0,<8",
	"requests-mock>=1.12.1,<2",
]
lint = [
	"ruff>=0.14",
	"mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
	--cache-clear
	--cov=ilert
	--cov-report=term-missing:skip-covered
	-ra
"""
testpaths = ["tests"]
pythonpath = ["."]
