[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "newrelic"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.11,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sekoia-automation-sdk>=1.21.1,<2",
    "requests>=2.33.0,<3",
    "requests-ratelimiter>=0.7.0,<0.8",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip>=26.2.2",
    "pytest",
    "pytest-cov",
    "requests",
    "requests-mock",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
install_types = true
non_interactive = true
show_column_numbers = true
show_error_context = false
packages = ["new_relic_modules"]

[tool.ruff]
target-version = "py311"
line-length = 119
fix = true

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "  --strict-markers\n  --tb=short\n  --cov=new_relic_modules\n  --cov-branch\n  --cache-clear\n  --cov-report=html\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=5\n  --capture=sys\n"
