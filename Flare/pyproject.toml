[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "Automation Module for Flare.io"
description = ""
version = "0.0"
authors = []
package-mode = false

[tool.black]
line-length = 119
target-version = ["py311"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 119

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
sekoia-automation-sdk = "^1.23.1"
flareio = "^2.4.1"
requests = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
requests-mock = "*"
isort = "^5.10.1"
mypy = "^1.10"
black = { version = "^26.1.0", extras = ["colorama"] }

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
allow_untyped_decorators = true
warn_return_any = true
pretty = true
show_error_codes = true
implicit_reexport = true
exclude = ["tests/*"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
