# Module-specific mise config.
# Common tools are inherited from the repository root mise.toml.
# This module also overrides lint/format tasks locally to ensure checks run
# against Flare files only.

[tools]
python = "3.14"

[env]
_.python.venv = { path = ".venv", create = false }

[tasks.lint]
description = "Check code style and types"
run = [
	"uv run ruff check .",
	"uv run ruff format --check .",
	"uv run mypy .",
]

[tasks.format]
description = "Format and auto-fix code"
run = [
	"uv run ruff check --fix .",
	"uv run ruff format .",
]
