[project]
name = "automation-module-sekoia-io"
version = "2.80.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests",
    "sekoia-automation-sdk>=1.27.0,<2",
    "tenacity",
    "websocket-client",
    "gevent",
    "orjson",
    "structlog>=25.5.0,<26",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "requests",
    "requests-mock",
]
lint = [
    "ruff>=0.16.7",
    "mypy>=2.3.1",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N801"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --cache-clear
    --cov=sekoiaio
    --cov-report=term-missing:skip-covered
    -ra
"""
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
