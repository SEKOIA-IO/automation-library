[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "sekoiaio"
version = "2.76.0"
description = ""
authors = []
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "requests",
    "sekoia-automation-sdk>=1.24.0,<2",
    "kafka-python",
    "tenacity",
    "ujson",
    "websocket-client",
    "gevent",
    "orjson",
    "structlog>=25.5.0,<26",
    "smart-open>=7.5.0,<8",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest",
    "pytest-cov",
    "requests",
    "requests-mock",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 119
fix = true

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
show_error_context = false
packages = ["sekoiaio"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
