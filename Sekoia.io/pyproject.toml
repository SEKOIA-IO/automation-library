[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "sekoiaio"
version = "2.77.0"
description = ""
authors = []
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests",
    "sekoia-automation-sdk>=1.26.0,<2",
    "tenacity",
    "websocket-client",
    "gevent",
    "orjson",
    "structlog>=25.5.0,<26",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest",
    "pytest-cov",
    "requests",
    "requests-mock",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py314"
line-length = 119
fix = true

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
show_error_context = false
packages = ["sekoiaio"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "FIX", # flake8-fixme
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
]
ignore = [
    "B017",
    "B904",
    "FIX003", # line-contains-xxx
    "FIX004", # line-contains-hack
    "C901",   # complex-structure
    "PT011",  # pytest-raises-too-broad
]
