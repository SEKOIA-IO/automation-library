[project]
name = "automation-module-akamai"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.23.1,<2",
    "edgegrid-python>=2.0.0,<3",
    "orjson>=3.10.16,<4",
    "requests-ratelimiter>=0.7.0,<1",
    "requests>=2.32.3,<3",
    "cachetools>=6.2.3,<7",
    "structlog>=25.2.0,<26",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "requests-mock",
    "freezegun>=1.5.1,<2",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"
fix = true

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "E501"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --cache-clear
    --cov=akamai_modules
    --cov-report=term-missing:skip-covered
    -ra
"""
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
