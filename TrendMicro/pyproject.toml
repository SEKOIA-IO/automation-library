[project]
name = "automation-module-trendmicro"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.27.0,<2",
    "requests>=2.32.5,<3",
    "orjson>=3.11.7,<4",
    "structlog>=25.5.0,<26",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "requests",
    "requests-mock",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "E501", "F841", "RUF059"]  # pre-existing test style
"dev.py" = ["ARG"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/", "dev.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --cache-clear
    --cov=trendmicro_modules
    --cov-branch
    --cov-report=term-missing:skip-covered
    -ra
"""
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", "main.py", "dev.py"]
