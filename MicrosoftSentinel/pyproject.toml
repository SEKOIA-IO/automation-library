[project]
name = "automation-module-microsoft-sentinel"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.27.0,<2",
    "azure-mgmt-securityinsight>=1.0.0,<2",
    "orjson>=3.10.15,<4",
    "azure-identity>=1.19.0,<2",
    "cachetools>=7.2.5,<8",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "E501", "N802"]

[tool.mypy]
strict = true
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
show_column_numbers = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --cache-clear
    --cov=microsoft_sentinel
    --cov-report=term-missing:skip-covered
    -ra
"""
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
