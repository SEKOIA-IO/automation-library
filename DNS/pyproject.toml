[project]
name = "automation-module-dns"
version = "0.3.0"
description = "DNS automation module for Sekoia.io"
authors = [{ name = "Khadim Bamba", email = "khadimkd004@gmail.com" }]
requires-python = ">=3.14,<4"
dependencies = [
	"sekoia-automation-sdk>=1.27.0,<2",
]

[dependency-groups]
dev = [
	"pytest>=9.0.3,<10",
	"pytest-cov>=7.0.0,<8",
	"ruff>=0.14",
	"mypy",
	"pip>=26.2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
install_types = true
non_interactive = true
show_column_numbers = true
show_error_context = false
packages = ["dns_modules"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
	--cache-clear
	--cov=dns_modules
	--cov-report=term-missing:skip-covered
	-ra
"""
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
