[project]
name = "fortigate"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["sekoia-automation-sdk>=1.13.0,<2"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "requests",
    "requests-mock",
    "mypy",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.build-backend]
module-root = ""

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.ruff]
target-version = "py314"
line-length = 119
fix = true

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
show_error_context = false
packages = ["fortigate"]

[[tool.mypy.overrides]]
module = ["requests", "requests.*", "sekoia_automation", "sekoia_automation.*"]
ignore_missing_imports = true
