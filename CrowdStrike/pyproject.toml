[project]
name = "automation-module-crowdstrike"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.26.0,<2",
    "aws-automation",
    "python-dateutil>=2.8.2,<3",
    "async-lru>=2.0.2,<3",
    "aiolimiter>=1.1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-env",
    "Faker",
    "aioresponses>=0.7.4",
    "gevent>=23.9",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.uv.sources]
aws-automation = { path = "../AWS" }

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
exclude = ["tests/*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = "  --strict-markers\n  --tb=short\n  --asyncio-mode=auto\n  --cov=crowdstrike_telemetry\n  --cov-branch\n  --cache-clear\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=90\n  --numprocesses=auto\n"

[tool.coverage.run]
omit = ["tests/*", "main.py", "crowdstrike_telemetry/metrics.py"]
concurrency = ["gevent"]
