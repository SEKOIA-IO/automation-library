[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "Automation Module for Holm Security"
description = ""
version = "0.0"
authors = []
package-mode = false

[tool.black]
line-length = 119
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
strict = false
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
exclude = ["tests/*", "main.py"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
python-dateutil = "^2.8.2"

[tool.poetry.dependencies.sekoia-automation-sdk]
extras = ["all"]
version = "^1.22.5"

[tool.poetry.dev-dependencies]
pytest = "*"
pytest-cov = "*"
requests-mock = "*"
mypy = "*"
isort = "*"
black = "*"
types-python-dateutil = "*"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = """
    --strict-markers
    --tb=short
    --cov=holm_security
    --cov-branch
    --cache-clear
    --cov-report=term-missing:skip-covered
    --cov-fail-under=5
    -ra
"""

[tool.coverage.run]
omit = ["tests/*", "main.py"]
