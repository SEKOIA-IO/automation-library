          }
        }

    - name: "Device Inventory Info: Collect (network asset)"
      description: "Transformed Holm Security network asset to OCSF Device Inventory Info event"
      data: |
        {
          "activity_id": 2,
          "activity_name": "Collect",
          "category_name": "Discovery",
          "category_uid": 5,
          "class_name": "Device Inventory Info",
          "class_uid": 5001,
          "type_name": "Device Inventory Info: Collect",
          "type_uid": 500102,
          "time": 1751532453.0,
          "metadata": {
            "product": {
