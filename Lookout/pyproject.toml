[project]
name = "automation-module-lookout"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.24.0,<2",
    "structlog>=25.3.0,<26",
    "requests>=2.32.3,<3",
    "requests-ratelimiter>=0.7.0,<1",
    "python-dateutil>=2.9.0.post0,<3",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "requests",
    "requests-mock",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
addopts = """
    --strict-markers
    --cache-clear
    --cov=lookout_modules
    --cov-report=term-missing:skip-covered
    --cov-fail-under=5
    -ra
"""

[tool.coverage.run]
omit = ["tests/*", "main.py"]
