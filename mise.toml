# Root mise config shared by all automation modules.
# Each module inherits these tools and tasks and only overrides what is specific
# (its Python version and its local .venv) in its own mise.toml.

[tools]
uv = "latest"

[tasks.test]
description = "Run tests"
run = "uv run pytest tests/"

[tasks.lint]
description = "Check code style and types"
run = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run mypy .",
]

[tasks.format]
description = "Format and auto-fix code"
run = [
    "uv run ruff check --fix .",
    "uv run ruff format .",
]
