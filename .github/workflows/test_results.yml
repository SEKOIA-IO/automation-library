name: Test Results

on:
  workflow_run:
    workflows: ["Build Modules"]
    types:
      - completed

permissions: {}

jobs:
  unit-test-results:
    permissions:
      actions: read  # for dawidd6/action-download-artifact to query and download artifacts
      checks: write  # for EnricoMi/publish-unit-test-result-action to create and update check runs
      contents: read  # for EnricoMi/publish-unit-test-result-action to read commits and compare branches
      pull-requests: write  # for EnricoMi/publish-unit-test-result-action to post and update PR comments
    name: Unit Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'

    steps:
      - name: Download Test Report
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File (*)/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"
