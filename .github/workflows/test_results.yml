name: Test Results

on:
  workflow_run:
    workflows: ["Build Modules"]
    types:
      - completed

permissions: {}

jobs:
  unit-test-results:
    permissions:
      actions: read  # for dawidd6/action-download-artifact to query and download artifacts
      checks: write  # for EnricoMi/publish-unit-test-result-action to create and update check runs
      contents: read  # for EnricoMi/publish-unit-test-result-action to read commits and compare branches
      pull-requests: write  # for EnricoMi/publish-unit-test-result-action to post and update PR comments
    name: Unit Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'

    steps:
      - name: Download Test Report
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File (*)/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"
