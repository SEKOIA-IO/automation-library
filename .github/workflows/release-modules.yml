name: Release modules

# Create a {slug}-{version} release for every module whose manifest version
# was increased on develop. For modules listing Python versions in the
# `fission.python-version` entry of their manifest, one fission package per
# Python version is attached to the release. Existing tags and releases are
# never replaced.

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      module:
        description: "Module directory to release (e.g. Sekoia.io)"
        required: true
        type: string

permissions: {}

jobs:
  detect:
    permissions:
      contents: read  # for actions/checkout to fetch code and tags
    name: Detect modules to release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/develop'
    outputs:
      sha: ${{ steps.detect.outputs.sha }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        name: List modules with an increased version
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            base=""
            if [ ! -f "$INPUT_MODULE/manifest.json" ]; then
              echo "::error::$INPUT_MODULE is not a module"
              exit 1
            fi
            candidates=("$INPUT_MODULE")
          else
            base="$BEFORE_SHA"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse "$sha^1")
            fi
            mapfile -t candidates < <(
              LC_ALL=C comm -12 \
                <(git diff -z --name-only "$base" "$sha" | tr '\0' '\n' | cut -d/ -f1 | LC_ALL=C sort -u) \
                <(git ls-files -z -- ':(glob)*/manifest.json' | tr '\0' '\n' | cut -d/ -f1 | LC_ALL=C sort -u)
            )
          fi

          matrix='[]'
          for dir in "${candidates[@]}"; do
            [ -n "$dir" ] || continue
            manifest="$dir/manifest.json"
            slug=$(jq -r '.slug // empty' "$manifest")
            version=$(jq -r '.version // empty' "$manifest")
            if [ -z "$slug" ] || [ -z "$version" ]; then
              echo "::warning::$manifest has no slug or version, skipping"
              continue
            fi
            tag="$slug-$version"

            if [ -n "$base" ]; then
              old_version=$(git show "$base:$manifest" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
              if [ -n "$old_version" ]; then
                highest=$(printf '%s\n%s\n' "$old_version" "$version" | sort -V | tail -n1)
                if [ "$old_version" = "$version" ] || [ "$highest" != "$version" ]; then
                  echo "$dir: version not increased ($old_version -> $version), skipping"
                  continue
                fi
              fi
            fi

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::notice::$dir: tag $tag already exists, skipping"
              continue
            fi

            # Modules listing Python versions in fission.python-version support fission
            fission=$(jq '((.fission // {})["python-version"] // []) | length > 0' "$manifest")

            echo "$dir: releasing $tag (fission packages: $fission)"
            matrix=$(jq -c \
              --arg dir "$dir" --arg slug "$slug" --arg version "$version" --arg tag "$tag" \
              --argjson fission "$fission" \
              '. + [{dir: $dir, slug: $slug, version: $version, tag: $tag, fission: $fission}]' <<< "$matrix")
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_MODULE: ${{ inputs.module }}

  release:
    permissions:
      contents: write  # to push tags and create releases
      pull-requests: read  # to find the pull request of the released commit
    name: Release ${{ matrix.module.tag }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != ''
    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false
    env:
      DIR: ${{ matrix.module.dir }}
      VERSION: ${{ matrix.module.version }}
      TAG: ${{ matrix.module.tag }}
      FISSION: ${{ matrix.module.fission }}
      SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      - name: Install uv
        if: matrix.module.fission
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Build fission packages
        if: matrix.module.fission
        run: .github/scripts/package-fission.sh "$DIR" "$RUNNER_TEMP/fission"

      - name: Create release
        run: |
          set -euo pipefail

          # Never replace an existing tag or release
          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists, nothing to do"
            exit 0
          fi
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, nothing to do"
            exit 0
          fi

          pr=$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' || true)
          changelog="$SERVER_URL/$REPOSITORY/blob/$TAG/${DIR// /%20}/CHANGELOG.md"
          if [ -n "$pr" ]; then
            notes="Released from #$pr. See the [changelog]($changelog)."
          else
            notes="Released from $SHA. See the [changelog]($changelog)."
          fi

          # Creating a ref fails if it already exists, so a tag is never moved
          gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null

          gh release create "$TAG" --repo "$REPOSITORY" --draft --verify-tag --title "$DIR $VERSION" --notes "$notes"
          if [ "$FISSION" = "true" ]; then
            gh release upload "$TAG" "$RUNNER_TEMP"/fission/*.zip --repo "$REPOSITORY"
          fi
          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
