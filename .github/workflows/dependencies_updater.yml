name: Update Module Dependencies

# Every week, update the dependencies of each automation module with
# `update_module_dependencies.py` and open one auto-merged pull request per module
# whose updated dependencies still pass the lint and the tests.
#
# The new dependencies are untrusted code, so the work is split in two:
#   update (no secrets): resolve and test, upload the four changed files;
#   pr (app credentials): check the uploaded files, never execute them, open the pull request.
on:
  schedule:
    - cron: "17 5 * * 1" # Monday, 05:17 UTC
  workflow_dispatch:
    inputs:
      module:
        description: "Update only this module (directory name). Leave empty for all modules."
        required: false
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  list:
    name: List modules
    permissions:
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: List modules
        id: list
        run: |
          modules=$(
            for dir in */; do
              dir=${dir%/}
              # an `if`, not `&&`: a failed test on the last directory would fail the loop under `bash -e`
              if [ -f "$dir/manifest.json" ] && [ -f "$dir/pyproject.toml" ] && [ -f "$dir/CHANGELOG.md" ] \
                && { [ -f "$dir/uv.lock" ] || [ -f "$dir/poetry.lock" ]; }; then
                echo "$dir"
              fi
            done | jq -R . | jq -sc .
          )
          if [ -n "$INPUT_MODULE" ]; then
            modules=$(jq -c --arg module "$INPUT_MODULE" 'map(select(. == $module))' <<< "$modules")
          fi
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Modules: $modules"
        env:
          INPUT_MODULE: ${{ inputs.module }}

  update:
    name: Update ${{ matrix.module }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: list
    if: needs.list.outputs.modules != '[]'
    timeout-minutes: 45
    strategy:
      matrix:
        module: ${{ fromJSON(needs.list.outputs.modules) }}
      fail-fast: false
      max-parallel: 20
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true

      - name: Update dependencies
        id: update
        run: |
          # the slug names the artifact: read it before any dependency code runs
          slug=$(jq -er .slug "$MODULE/manifest.json")

          # some poetry resolutions never end: bound them, the script restores the module on SIGTERM
          timeout 1200 uv run update_module_dependencies.py "$MODULE" 2>&1 | tee "$RUNNER_TEMP/update.log"

          if [ -z "$(git status --porcelain -- "$MODULE")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "$MODULE/uv.lock" ]; then lock=uv.lock; else lock=poetry.lock; fi
          out="$RUNNER_TEMP/out"
          mkdir "$out"
          cp "$MODULE/pyproject.toml" "$MODULE/$lock" "$MODULE/manifest.json" "$MODULE/CHANGELOG.md" "$out/"
          cp "$RUNNER_TEMP/update.log" "$out/"
          {
            echo "changed=true"
            echo "package_manager=${lock%.lock}"
            echo "slug=$slug"
          } >> "$GITHUB_OUTPUT"

      - name: Test with Poetry
        if: steps.update.outputs.package_manager == 'poetry'
        uses: ./.github/actions/test-with-poetry
        with:
          module: ${{ matrix.module }}

      - name: Test with uv
        if: steps.update.outputs.package_manager == 'uv'
        uses: ./.github/actions/test-with-uv
        with:
          module: ${{ matrix.module }}

      - name: Upload the updated files
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-${{ steps.update.outputs.slug }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 1

  collect:
    name: List updated modules
    permissions:
      actions: read  # to list the artifacts of this run
    runs-on: ubuntu-latest
    needs: update
    if: ${{ !cancelled() && needs.update.result != 'skipped' }}
    outputs:
      slugs: ${{ steps.collect.outputs.slugs }}
    steps:
      - name: List the artifacts
        id: collect
        run: |
          slugs=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("update-")) | .name | ltrimstr("update-")' |
              jq -R . | jq -sc .
          )
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Updated modules: $slugs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr:
    name: Pull request ${{ matrix.slug }}
    permissions:
      contents: read  # pull requests are created with the app token
    runs-on: ubuntu-latest
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.slugs != '' && needs.collect.outputs.slugs != '[]' }}
    timeout-minutes: 15
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.collect.outputs.slugs) }}
      fail-fast: false
      max-parallel: 5  # stay clear of the limits on creating pull requests
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the updated files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-${{ matrix.slug }}
          path: ${{ runner.temp }}/artifact

      # the artifact comes from a job that ran new dependencies: only data is read here, nothing is executed
      - name: Check and apply the updated files
        id: apply
        run: |
          art="$RUNNER_TEMP/artifact"
          fail() { echo "::error::$*"; exit 1; }

          git check-ref-format "refs/heads/dependencies/$SLUG" && [[ "$SLUG" =~ ^[a-z0-9][a-z0-9._-]*$ ]] \
            || fail "invalid slug"

          # the module is found from the trusted checkout, never from the artifact
          module=""
          for dir in */; do
            dir=${dir%/}
            if [ -f "$dir/manifest.json" ] && [ "$(jq -r '.slug // empty' "$dir/manifest.json")" = "$SLUG" ]; then
              module=$dir
              break
            fi
          done
          [ -n "$module" ] || fail "no module has the slug $SLUG"

          if [ -f "$module/uv.lock" ]; then lock=uv.lock; else lock=poetry.lock; fi
          expected=$(printf '%s\n' CHANGELOG.md manifest.json pyproject.toml "$lock" update.log | sort)
          [ "$(find "$art" -mindepth 1 -printf '%P\n' | sort)" = "$expected" ] || fail "unexpected files in the artifact"
          [ -z "$(find "$art" -mindepth 1 ! -type f)" ] || fail "the artifact contains something else than regular files"
          [ -z "$(find "$art" -type f -size +5M)" ] || fail "a file of the artifact is too large"

          # the manifest only gets a patch bump and the changelog only gets new lines
          old=$(jq -er .version "$module/manifest.json")
          new=$(jq -er .version "$art/manifest.json")
          [[ "$old" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || fail "unexpected version $old"
          [ "$new" = "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))" ] || fail "unexpected version $new"
          [ "$(git diff --no-index --numstat "$module/manifest.json" "$art/manifest.json" | cut -f1,2)" = $'1\t1' ] \
            || fail "the manifest changed beyond its version"
          [ "$(git diff --no-index --numstat "$module/CHANGELOG.md" "$art/CHANGELOG.md" | cut -f2)" = "0" ] \
            || fail "the changelog lost lines"

          cp --no-dereference "$art/pyproject.toml" "$art/$lock" "$art/manifest.json" "$art/CHANGELOG.md" "$module/"

          # the log is text from next to untrusted code: keep a few plain lines
          {
            echo "Automated update of the dependencies of \`$module\`, generated by \`update_module_dependencies.py\`."
            echo
            echo '```'
            grep -E '^(✓|  |Skip|Could not bump)' "$art/update.log" | tr -d '`@' | cut -c1-300 | head -60 || true
            echo '```'
          } > "$RUNNER_TEMP/pull_request_body.md"

          {
            echo "module=$module"
            echo "add_paths<<EOF"
            printf '%s\n' "$module/pyproject.toml" "$module/$lock" "$module/manifest.json" "$module/CHANGELOG.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # the app token, unlike GITHUB_TOKEN, lets the pull request trigger the CI workflows
      - name: Get app token
        id: app-token
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: create_pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: dependencies/${{ matrix.slug }}
          add-paths: ${{ steps.apply.outputs.add_paths }}
          commit-message: "chore(${{ steps.apply.outputs.module }}): update dependencies"
          title: "[dependencies] Update dependencies of ${{ steps.apply.outputs.module }}"
          body-path: ${{ runner.temp }}/pull_request_body.md
          delete-branch: true  # not a draft: GitHub refuses auto-merge on draft pull requests

      - name: Enable auto-merge on PR
        if: steps.create_pr.outputs.pull-request-operation == 'created'
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
