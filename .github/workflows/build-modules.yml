name: Build Modules

# Test and build every changed module. On develop, every module whose manifest
# version was increased is released: its Docker image is pushed, a
# {slug}-{version} tag and GitHub Release are created (with one fission
# package per Python version listed in the `fission.python-version` entry of
# its manifest), and only then is the module deployed. Existing tags and
# releases are never replaced.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      module:
        description: "Module directory to release and deploy (e.g. Sekoia.io). Leave empty to test and build every module."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  SECONDARY_REGISTRY: registry.sekoia.io
  IMAGE_PREFIX_NAME: sekoia-io
  # Runner image of the HWL actions (action_*.yml) of a module
  HWL_BASE_IMAGE: ghcr.io/sekoialab/symphony-hwl-automation:0.1.0

permissions: {}

jobs:
  detect:
    permissions:
      contents: read  # for actions/checkout to fetch code and tags
    name: Find modules in repo
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.detect.outputs.sha }}
      modules: ${{ steps.detect.outputs.modules }}
      python_modules: ${{ steps.detect.outputs.python_modules }}
      hwl_modules: ${{ steps.detect.outputs.hwl_modules }}
      releases: ${{ steps.detect.outputs.releases }}
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - id: detect
        name: List changed modules and modules to release
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          list_modules() {
            git ls-files -z -- ':(glob)*/manifest.json' | tr '\0' '\n' | cut -d/ -f1 | LC_ALL=C sort -u
          }

          # Modules having changed files
          base=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_MODULE" ]; then
              mapfile -t modules < <(list_modules)
            elif [ -f "$INPUT_MODULE/manifest.json" ]; then
              modules=("$INPUT_MODULE")
            else
              echo "::error::$INPUT_MODULE is not a module"
              exit 1
            fi
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base=$(git rev-parse "$sha^1")
            else
              base="$BEFORE_SHA"
              if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                base=$(git rev-parse "$sha^1")
              fi
            fi
            mapfile -t modules < <(
              LC_ALL=C comm -12 \
                <(git diff -z --name-only "$base" "$sha" | tr '\0' '\n' | cut -d/ -f1 | LC_ALL=C sort -u) \
                <(list_modules)
            )
          fi
          to_json() { printf '%s\n' "$@" | jq -R -s -c 'split("\n") | map(select(length > 0))'; }
          echo "modules=$(to_json "${modules[@]}")" >> "$GITHUB_OUTPUT"

          # A module has a Python image if it has a Dockerfile, and an HWL
          # image if it has HWL actions
          python_modules=()
          hwl_modules=()
          for dir in "${modules[@]}"; do
            [ -n "$dir" ] || continue
            [ -f "$dir/Dockerfile" ] && python_modules+=("$dir")
            compgen -G "$dir/action_*.yml" >/dev/null && hwl_modules+=("$dir")
          done
          echo "python_modules=$(to_json "${python_modules[@]}")" >> "$GITHUB_OUTPUT"
          echo "hwl_modules=$(to_json "${hwl_modules[@]}")" >> "$GITHUB_OUTPUT"

          # Modules to release: those with an increased version on develop, or
          # the module given to a manual run
          release=false
          if [ "$REF" = "refs/heads/develop" ] && [ "$ACTOR" != "dependabot[bot]" ]; then
            if [ "$EVENT_NAME" = "push" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_MODULE" ]; }; then
              release=true
            fi
          fi

          releases='[]'
          if [ "$release" = "true" ]; then
            for dir in "${modules[@]}"; do
              [ -n "$dir" ] || continue
              manifest="$dir/manifest.json"
              slug=$(jq -r '.slug // empty' "$manifest")
              version=$(jq -r '.version // empty' "$manifest")
              if [ -z "$slug" ] || [ -z "$version" ]; then
                echo "::warning::$manifest has no slug or version, skipping"
                continue
              fi
              tag="$slug-$version"

              if [ -n "$base" ]; then
                old_version=$(git show "$base:$manifest" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
                if [ -n "$old_version" ]; then
                  highest=$(printf '%s\n%s\n' "$old_version" "$version" | sort -V | tail -n1)
                  if [ "$old_version" = "$version" ] || [ "$highest" != "$version" ]; then
                    echo "$dir: version not increased ($old_version -> $version), skipping"
                    continue
                  fi
                fi

                if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                  echo "::notice::$dir: tag $tag already exists, skipping"
                  continue
                fi
              fi

              # Modules listing Python versions in fission.python-version support fission
              fission=$(jq '((.fission // {})["python-version"] // []) | length > 0' "$manifest")

              python=false
              [ -f "$dir/Dockerfile" ] && python=true
              hwl=false
              compgen -G "$dir/action_*.yml" >/dev/null && hwl=true

              echo "$dir: releasing $tag (fission packages: $fission, python image: $python, hwl image: $hwl)"
              releases=$(jq -c \
                --arg dir "$dir" --arg slug "$slug" --arg version "$version" --arg tag "$tag" \
                --argjson fission "$fission" --argjson python "$python" --argjson hwl "$hwl" \
                '. + [{dir: $dir, slug: $slug, version: $version, tag: $tag, fission: $fission, python: $python, hwl: $hwl}]' <<< "$releases")
            done
          fi
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_MODULE: ${{ inputs.module }}

  test:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: Test module ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    strategy:
      matrix:
        module: ${{fromJSON(needs.detect.outputs.modules)}}
      fail-fast: false
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: setup-python
        with:
          python-version: "3.11"

      - name: Detect package manager
        id: detect-pm
        run: |
          if [ -f "${MODULE_PATH}/uv.lock" ]; then
            echo "package_manager=uv" >> "$GITHUB_OUTPUT"
            echo "Detected uv project"
          else
            echo "package_manager=poetry" >> "$GITHUB_OUTPUT"
            echo "Defaulting to Poetry"
          fi
        env:
          MODULE_PATH: ${{ matrix.module }}

      - name: Test with Poetry
        if: steps.detect-pm.outputs.package_manager == 'poetry'
        uses: ./.github/actions/test-with-poetry
        with:
          module: ${{ matrix.module }}

      - name: Test with uv
        if: steps.detect-pm.outputs.package_manager == 'uv'
        uses: ./.github/actions/test-with-uv
        with:
          module: ${{ matrix.module }}

      - name: Upload Event
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Event File (${{ matrix.module }})
          path: ${{ github.event_path }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Unit Test Results (${{ matrix.module }})
          path: "${{ matrix.module }}/junit.xml"

      - name: Code Coverage Flag
        run: |
          FLAG="${MATRIX_MODULE}"
          FLAG=${FLAG// } # replace spaces
          echo "FLAG=${FLAG}" >> "$GITHUB_ENV" # update GitHub ENV vars
        env:
          MATRIX_MODULE: ${{ matrix.module }}

      - name: Code Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module }}/coverage.xml
          flags: ${{ env.FLAG }}
          fail_ci_if_error: true

  # Images are only pushed by the release job, this one checks that they build
  build-docker:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: Build ${{ matrix.module }} docker image
    runs-on: ubuntu-latest
    needs: detect
    if: >-
      needs.detect.outputs.python_modules != '[]' && github.actor != 'dependabot[bot]'
      && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.module == ''))
    strategy:
      matrix:
        module: ${{fromJSON(needs.detect.outputs.python_modules)}}
      fail-fast: false
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: false
          context: ${{ matrix.module }}

  # Same as above for the image of the HWL actions of a module
  build-hwl-docker:
    permissions:
      contents: read  # for actions/checkout to fetch code
      packages: read  # for docker/login-action to pull the runner image from GHCR
    name: Build ${{ matrix.module }} HWL docker image
    runs-on: ubuntu-latest
    needs: detect
    if: >-
      needs.detect.outputs.hwl_modules != '[]' && github.actor != 'dependabot[bot]'
      && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.module == ''))
    strategy:
      matrix:
        module: ${{fromJSON(needs.detect.outputs.hwl_modules)}}
      fail-fast: false
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build HWL Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: false
          context: ${{ matrix.module }}
          file: .github/docker/hwl.Dockerfile
          build-args: HWL_BASE_IMAGE=${{ env.HWL_BASE_IMAGE }}

  test-gate:
    name: Build & Test Gate
    runs-on: ubuntu-latest
    needs: [detect, test, build-docker, build-hwl-docker]
    if: always()

    steps:
      - name: Success
        if: ${{ !(contains(needs.*.result, 'failure')) || needs.detect.outputs.modules == '[]' }}
        run: exit 0
      - name: Failure
        if: ${{ contains(needs.*.result, 'failure') && needs.detect.outputs.modules != '[]' }}
        run: |
          exit 1

  # Push the image, create the release, then deploy: a module is only deployed
  # once both its image and its release exist
  release:
    permissions:
      contents: write  # to push tags and create releases
      packages: write  # for docker/login-action to push images to GHCR
      pull-requests: read  # to find the pull request of the released commit
    name: Release ${{ matrix.module.tag }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.releases != '[]' && needs.detect.outputs.releases != ''
    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.releases) }}
      fail-fast: false
    env:
      DIR: ${{ matrix.module.dir }}
      VERSION: ${{ matrix.module.version }}
      TAG: ${{ matrix.module.tag }}
      FISSION: ${{ matrix.module.fission }}
      SHA: ${{ needs.detect.outputs.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check-out the repo under $GITHUB_WORKSPACE
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      # A published release is only deployed again. Never replace an existing
      # tag or release: leftovers of a failed run must be deleted by hand.
      - id: existing
        name: Check existing release
        run: |
          set -euo pipefail

          if release=$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft 2>/dev/null); then
            if [ "$(jq -r '.isDraft' <<< "$release")" = "false" ]; then
              echo "::notice::Release $TAG is already published, only deploying it"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release $TAG is a draft, delete it to release $DIR again"
            exit 1
          fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists without a release, delete it to release $DIR again"
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        if: steps.existing.outputs.published == 'false'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the secondary Container registry
        if: steps.existing.outputs.published == 'false'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.SECONDARY_REGISTRY }}
          username: ${{ secrets.SECONDARY_REGISTRY_USERNAME }}
          password: ${{ secrets.SECONDARY_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.existing.outputs.published == 'false' && matrix.module.python
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_NAME }}/automation-module-${{ matrix.module.slug }}
            ${{ env.SECONDARY_REGISTRY }}/${{ env.IMAGE_PREFIX_NAME }}/automation-module-${{ matrix.module.slug }}
          flavor: |
            latest=auto
            prefix=
            suffix=
          tags: |
            type=pep440,pattern={{version}},value=${{ matrix.module.version }}

      - name: Set up Docker Buildx
        if: steps.existing.outputs.published == 'false'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push Docker image
        if: steps.existing.outputs.published == 'false' && matrix.module.python
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: true
          context: ${{ matrix.module.dir }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract metadata (tags, labels) for the HWL Docker image
        if: steps.existing.outputs.published == 'false' && matrix.module.hwl
        id: meta-hwl
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_NAME }}/automation-module-${{ matrix.module.slug }}-hwl
            ${{ env.SECONDARY_REGISTRY }}/${{ env.IMAGE_PREFIX_NAME }}/automation-module-${{ matrix.module.slug }}-hwl
          flavor: |
            latest=auto
            prefix=
            suffix=
          tags: |
            type=pep440,pattern={{version}},value=${{ matrix.module.version }}

      - name: Build and push HWL Docker image
        if: steps.existing.outputs.published == 'false' && matrix.module.hwl
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: true
          context: ${{ matrix.module.dir }}
          file: .github/docker/hwl.Dockerfile
          build-args: HWL_BASE_IMAGE=${{ env.HWL_BASE_IMAGE }}
          tags: ${{ steps.meta-hwl.outputs.tags }}
          labels: ${{ steps.meta-hwl.outputs.labels }}

      - name: Install uv
        if: steps.existing.outputs.published == 'false' && matrix.module.fission
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false  # never restore a cache in a job publishing artifacts

      - name: Build fission packages
        if: steps.existing.outputs.published == 'false' && matrix.module.fission
        run: .github/scripts/package-fission.sh "$DIR" "$RUNNER_TEMP/fission"

      - name: Create release
        if: steps.existing.outputs.published == 'false'
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' || true)
          changelog="$SERVER_URL/$REPOSITORY/blob/$TAG/${DIR// /%20}/CHANGELOG.md"
          if [ -n "$pr" ]; then
            notes="Released from #$pr. See the [changelog]($changelog)."
          else
            notes="Released from $SHA. See the [changelog]($changelog)."
          fi

          # Creating a ref fails if it already exists, so a tag is never moved
          gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null

          gh release create "$TAG" --repo "$REPOSITORY" --draft --verify-tag --title "$DIR $VERSION" --notes "$notes"
          if [ "$FISSION" = "true" ]; then
            gh release upload "$TAG" "$RUNNER_TEMP"/fission/*.zip --repo "$REPOSITORY"
          fi
          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}

      - name: my-app-install token
        id: my-app
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Deploy module
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.my-app.outputs.token }}
          event-type: publish-automation-modules
          repository: SekoiaLab/platform
          client-payload: '{"module": ${{ toJSON(matrix.module.dir) }}}'
