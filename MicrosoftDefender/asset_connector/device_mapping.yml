mapping:
  ocsf_class: "Device Inventory Info"
  class_uid: 5001
  ocsf_version: "1.5.0"

  sources:
    primary:
      name: "Microsoft Defender for Endpoint"
      endpoint: "GET /api/machines"
      description: "Machine inventory from Defender for Endpoint API"
    enrichment:
      name: "Microsoft Graph / Intune"
      endpoint: "GET /v1.0/deviceManagement/managedDevices?$filter=azureADDeviceId eq '{aadDeviceId}'"
      description: "Hardware and compliance details from Intune, keyed on aadDeviceId"

  samples:
    - name: "Defender for Endpoint Machine"
      description: "A machine from the Defender for Endpoint /api/machines endpoint"
      data: |
        {
          "id": "1e5bc9d7e413ddd7902c2932e418702b84d0cc07",
          "computerDnsName": "mymachine1.contoso.com",
          "firstSeen": "2018-08-02T14:55:03.7791856Z",
          "lastSeen": "2024-12-01T10:00:00Z",
          "osPlatform": "Windows10",
          "version": "1709",
          "osProcessor": "x64",
          "osArchitecture": "64-bit",
          "osBuild": 18209,
          "lastIpAddress": "172.17.230.209",
          "lastExternalIpAddress": "167.220.196.71",
          "healthStatus": "Active",
          "onboardingstatus": "Onboarded",
          "rbacGroupId": "140",
          "rbacGroupName": "The-A-Team",
          "riskScore": "Low",
          "exposureLevel": "Medium",
          "aadDeviceId": "80fe8ff8-2624-418e-9591-41f0491218f9",
          "deviceValue": "Normal",
          "machineTags": ["test tag 1", "test tag 2"],
          "ipAddresses": [{"ipAddress": "172.17.230.209", "macAddress": "11:22:33:44:55:66", "type": "Ethernet"}]
        }

    - name: "Intune Managed Device (enrichment)"
      description: "Matched managed device from Graph API using aadDeviceId"
      data: |
        {
          "id": "705c034c-034c-705c-4c03-5c704c035c70",
          "deviceName": "DESKTOP-ABC123",
          "operatingSystem": "Windows",
          "osVersion": "10.0.22631.3880",
          "model": "Surface Pro 9",
          "manufacturer": "Microsoft Corporation",
          "wiFiMacAddress": "AA:BB:CC:DD:EE:FF",
          "ethernetMacAddress": "11:22:33:44:55:66",
          "complianceState": "compliant",
          "managedDeviceOwnerType": "company",
          "userPrincipalName": "user@contoso.com",
          "managementAgent": "mdm",
          "isSupervised": false,
          "azureADDeviceId": "80fe8ff8-2624-418e-9591-41f0491218f9"
        }

  fields:
    # Static OCSF classification
    - source: "static: 2"
      target: "activity_id"
      type: "integer"
      logic: "Always 2 for 'Collect' activity"
      description: "OCSF activity ID"

    - source: "static: Collect"
      target: "activity_name"
      type: "string"
      logic: "Always 'Collect'"
      description: "OCSF activity name"

    - source: "static: Discovery"
      target: "category_name"
      type: "string"
      logic: "Always 'Discovery'"
      description: "OCSF category name"

    - source: "static: 5"
      target: "category_uid"
      type: "integer"
      logic: "Always 5 for Discovery"
      description: "OCSF category UID"

    - source: "static: 5001"
      target: "class_uid"
      type: "integer"
      logic: "Device Inventory Info class"
      description: "OCSF class UID"

    - source: "static: 500102"
      target: "type_uid"
      type: "integer"
      logic: "Device Inventory Info: Collect"
      description: "OCSF type UID"

    # Device identity — from Defender
    - source: "machine.id"
      target: "device.uid"
      type: "string"
      logic: "Direct mapping"
      description: "Defender machine ID"

    - source: "machine.computerDnsName"
      target: "device.hostname"
      type: "string"
      logic: "Direct mapping"
      description: "Fully qualified DNS name"

    - source: "machine.lastIpAddress"
      target: "device.ip"
      type: "string"
      logic: "Direct mapping"
      description: "Last known local IP address"

    # OS — base from Defender, enriched from Intune if available
    - source: "machine.osPlatform"
      target: "device.os.type"
      type: "string"
      logic: "Map to OCSF OSTypeStr: windows→WINDOWS, linux→LINUX, macos→MACOS, android→ANDROID, ios→IOS"
      description: "Operating system type"

    - source: "machine.osPlatform + machine.osBuild || managedDevice.os_version"
      target: "device.os.name"
      type: "string"
      logic: "Use Intune os_version when available, else '{osPlatform} (Build {osBuild})'"
      description: "OS version string"

    # Hardware — from Intune enrichment
    - source: "managedDevice.model"
      target: "device.model"
      type: "string"
      logic: "From Intune if machine has aadDeviceId"
      description: "Device hardware model"

    - source: "managedDevice.manufacturer"
      target: "device.vendor_name"
      type: "string"
      logic: "From Intune if machine has aadDeviceId"
      description: "Device manufacturer"

    # Timestamps — from Defender
    - source: "machine.firstSeen"
      target: "device.first_seen_time"
      type: "timestamp"
      logic: "Convert ISO 8601 to Unix epoch"
      description: "First seen time (also used as checkpoint)"

    - source: "machine.lastSeen"
      target: "device.last_seen_time"
      type: "timestamp"
      logic: "Convert ISO 8601 to Unix epoch"
      description: "Last seen time"

    # Risk — from Defender
    - source: "machine.riskScore"
      target: "device.risk_level / device.risk_level_id"
      type: "enum"
      logic: "informational→INFO, low→LOW, medium→MEDIUM, high→HIGH, critical→CRITICAL"
      description: "Risk level as evaluated by Defender"

    # Compliance — from Intune
    - source: "managedDevice.compliance_state"
      target: "device.is_compliant"
      type: "boolean"
      logic: "True if complianceState == 'compliant'"
      description: "Whether device is compliant"

    - source: "managedDevice.managed_device_owner_type"
      target: "device.is_personal"
      type: "boolean"
      logic: "True if ownerType == 'personal'"
      description: "Whether device is personally owned"

    # Network interfaces — from Intune
    - source: "managedDevice.ethernet_mac_address"
      target: "device.network_interfaces[].mac"
      type: "string"
      logic: "Added as ethernet interface if present"
      description: "Ethernet MAC address"

    - source: "managedDevice.wi_fi_mac_address"
      target: "device.network_interfaces[].mac"
      type: "string"
      logic: "Added as wifi interface if present"
      description: "WiFi MAC address"

    # Enrichments
    - source: "machine.aadDeviceId"
      target: "enrichments[].value"
      type: "string"
      logic: "Stored as enrichment name='azure_ad_device_id'"
      description: "Azure AD / Entra device ID"

    - source: "machine.healthStatus"
      target: "enrichments[].value"
      type: "string"
      logic: "Stored as enrichment name='health_status'"
      description: "Defender health status"

    - source: "machine.exposureLevel"
      target: "enrichments[].value"
      type: "string"
      logic: "Stored as enrichment name='exposure_level'"
      description: "Defender exposure level"

    - source: "machine.rbacGroupName"
      target: "enrichments[].value"
      type: "string"
      logic: "Stored as enrichment name='rbac_group_name'"
      description: "RBAC group name"

    - source: "managedDevice.user_principal_name"
      target: "enrichments[].value"
      type: "string"
      logic: "Stored as enrichment name='user_principal_name'"
      description: "User principal name from Intune"

    - source: "managedDevice.management_agent"
      target: "enrichments[].value"
      type: "string"
      logic: "Stored as enrichment name='management_agent'"
      description: "Management agent type from Intune"

    # Event time
    - source: "machine.lastSeen || machine.firstSeen"
      target: "time"
      type: "timestamp"
      logic: "Use lastSeen if available, fallback to firstSeen, then current time"
      description: "OCSF event timestamp"

  checkpoint:
    field: "firstSeen"
    storage_key: "most_recent_date_seen"
    filter: "$filter=firstSeen+ge+{most_recent_date_seen}"
    description: "On subsequent runs, only fetch machines with firstSeen >= last checkpoint value"

  ocsf_samples:
    - name: "Transformed Device Output"
      description: "OCSF DeviceOCSFModel after merging Defender + Intune data"
      data: |
        {
          "activity_id": 2,
          "activity_name": "Collect",
          "category_name": "Discovery",
          "category_uid": 5,
          "class_name": "Device Inventory Info",
          "class_uid": 5001,
          "type_name": "Device Inventory Info: Collect",
          "type_uid": 500102,
          "severity": "Informational",
          "severity_id": 1,
