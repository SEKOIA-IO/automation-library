[project]
name = "automation-module-http"
version = "1.121.1"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
	"sekoia-automation-sdk>=1.27.0,<2",
	"requests>=2.32.5,<3",
	"tenacity>=9.1.4,<10",
]

[dependency-groups]
dev = [
	"mypy>=2.4.0",
	"pip>=26.2.1",
	"pytest>=9.0.3,<10",
	"pytest-cov>=7.0.0,<8",
	"requests",
	"requests-mock>=1.12.1,<2",
	"ruff>=0.14",
	"mypy",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
#ignore_missing_imports = true
show_column_numbers = true
show_error_context = false
exclude = ["tests/"]
packages = ["http_module"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
	--cache-clear
	--cov=http_module
	--cov-report=term-missing:skip-covered
	-ra
"""
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
