[project]
name = "automation-module-trellix"
version = "0.0"
description = "Sekoia.io Automation Module to work with Trellix EDR and ePO events"
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.27.0,<2",
    "orjson>=3.7.7,<4",
    "python-dateutil>=2.8.2,<3",
    "async-lru>=2.0.2,<3",
    "aiohttp>=3.13.4,<3.14",  # aioresponses 0.7.9 (tests) is not compatible with aiohttp 3.14 (ClientResponse stream_writer)
    "aiolimiter>=1.1.0,<2",
    "aiohttp-retry>=2.8.3,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-env",
    "Faker",
    "aioresponses>=0.7.4,<1",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]
# Pre-existing, left as is: N815/N818 mirror the Trellix API field names and a public exception name,
# E501 only hits long comments/strings, RUF012/UP042/UP046 are style-only.
ignore = ["E501", "N815", "N818", "RUF012", "UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = "  --strict-markers\n  --tb=short\n  --cov=connectors\n  --cov=client\n  --cov-branch\n  --cache-clear\n  --cov-report=html\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=5\n  --numprocesses=auto\n  --asyncio-mode=auto\n  --capture=sys\n"

[tool.coverage.run]
omit = ["tests/*", "main.py"]
