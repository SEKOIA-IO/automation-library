[project]
name = "automation-module-sophos"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "sekoia-automation-sdk>=1.28.1,<2",
    "requests>=2.32.5,<3",
    "requests-ratelimiter>=0.7.0,<1",
    "structlog>=23.1.0",
    "tenacity>=9.1.2,<10",
    "orjson>=3.10.7,<4",
    "python-dateutil>=2.9.0,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "requests-mock",
]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.15.20",
    "types-python-dateutil",
    "types-requests",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"
extend-exclude = [".tmp", "test_end_to_end"]

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# pydantic models mirror the camelCase fields of the Sophos API
"sophos_module/asset_connector/model.py" = ["N801", "N815"]

[tool.mypy]
python_version = "3.14"
files = ["sophos_module", "main.py"]
exclude = "(^|/)\\.venv/|(^|/)\\.tmp/|(^|/)tests/|(^|/)test_end_to_end/"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
allow_untyped_decorators = true
implicit_reexport = true
show_column_numbers = true
show_error_codes = true

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = "  --strict-markers\n  --tb=short\n  --cov=sophos_module\n  --cov-branch\n  --cache-clear\n  --cov-report=html\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=90\n  --numprocesses=auto\n"
