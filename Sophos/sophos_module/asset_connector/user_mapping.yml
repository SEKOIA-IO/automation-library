mapping:
  ocsf_class: "User Inventory Info"
  class_uid: 5003
  ocsf_version: "1.6.0"

  samples:
    - name: "Named user with email"
      description: "A Sophos directory user with full name and email address"
      data: |
        {
          "id": "00000000-0000-0000-0000-000000000001",
          "name": "Jane Doe",
          "firstName": "Jane",
          "lastName": "Doe",
          "email": "jane.doe@example.com",
          "exchangeLogin": "",
          "groups": { "total": 0, "itemsCount": 0, "items": [] },
          "tenant": { "id": "00000000-0000-0000-0000-000000000010" },
          "source": { "type": "custom" },
          "createdAt": "2023-06-16T15:00:56.473Z",
          "updatedAt": "2023-06-16T15:00:56.870Z"
        }
    - name: "Windows local account"
      description: "A Sophos directory user representing a Windows local account (DOMAIN\\username)"
      data: |
        {
          "id": "00000000-0000-0000-0000-000000000002",
          "name": "DESKTOP-ABC1234\\jdoe",
          "groups": { "total": 0, "itemsCount": 0, "items": [] },
          "tenant": { "id": "00000000-0000-0000-0000-000000000010" },
          "source": { "type": "custom" },
          "createdAt": "2025-12-10T12:49:12.371Z",
          "updatedAt": "2025-12-11T12:22:37.223Z"
        }
    - name: "User with groups"
      description: "A Sophos directory user that belongs to one or more groups"
      data: |
        {
          "id": "00000000-0000-0000-0000-000000000003",
          "name": "John Smith",
          "email": "john.smith@example.onmicrosoft.com",
          "groups": {
            "total": 1,
            "itemsCount": 1,
            "items": [
              {
                "id": "00000000-0000-0000-0000-000000000020",
                "name": "example.onmicrosoft.com",
                "displayName": "example.onmicrosoft.com"
              }
            ]
          },
          "tenant": { "id": "00000000-0000-0000-0000-000000000010" },
          "source": { "type": "custom" },
          "createdAt": "2023-11-20T09:46:38.886Z"
        }

  fields:
    # EVENT CLASSIFICATION
    - source: "static: 2"
      target: "activity_id"
      type: "integer"
      description: "OCSF activity ID – always 2 for Collect"

    - source: "static: Collect"
      target: "activity_name"
      type: "string"
      description: "OCSF activity name"

    - source: "static: Discovery"
      target: "category_name"
      type: "string"
      description: "OCSF category name"

    - source: "static: 5"
      target: "category_uid"
      type: "integer"
      description: "OCSF category UID"

    - source: "static: User Inventory Info"
      target: "class_name"
      type: "string"
      description: "OCSF class name"

    - source: "static: 5003"
      target: "class_uid"
      type: "integer"
      description: "OCSF class UID"

    - source: "static: 500302"
      target: "type_uid"
      type: "integer"
      description: "OCSF type UID"

    - source: "static: User Inventory Info: Collect"
      target: "type_name"
      type: "string"
      description: "OCSF type name"

    - source: "static: Informational"
      target: "severity"
      type: "string"
      description: "Event severity"

    - source: "static: 1"
      target: "severity_id"
      type: "integer"
      description: "OCSF severity ID"

    # METADATA
    - source: "static: Sophos EDR"
      target: "metadata.product.name"
      type: "string"
      description: "Source product name"

    - source: "static: N/A"
      target: "metadata.product.version"
      type: "string"
      description: "Product version"

    - source: "static: 1.6.0"
      target: "metadata.version"
      type: "string"
      description: "OCSF schema version"

    # TIMESTAMPS
    - source: "updatedAt (fallback: createdAt, then now)"
      target: "time"
      type: "timestamp"
      logic: "Parse ISO-8601 timestamp; convert to Unix epoch float"
      description: "OCSF event timestamp"

    # USER FIELDS
    - source: "id"
      target: "user.uid"
      type: "string"
      logic: "Direct mapping"
      description: "Unique Sophos user identifier → OCSF user.uid"

    - source: "name"
      target: "user.name"
      type: "string"
      logic: "Direct mapping"
      description: "Display name of the user"

    - source: "firstName + lastName"
      target: "user.full_name"
      type: "string"
      logic: "Concatenate firstName and lastName with a space when either is present"
      description: "Full name constructed from first and last name fields"

    - source: "email"
      target: "user.email_addr"
      type: "string"
      logic: "Direct mapping; omitted when null or empty"
      description: "Primary email address of the user"

    - source: "static: User"
      target: "user.type_id / user.type"
      type: "integer / string"
      logic: "All Sophos directory users are classified as UserTypeId.USER (1)"
      description: "OCSF user type classification"

    - source: "name (presence of backslash and absence of email)"
      target: "user.account.type_id / user.account.type"
      type: "integer / string"
      logic: |
        If name contains '\' and email is absent → AccountTypeId.WINDOWS_ACCOUNT (2)
        Otherwise → AccountTypeId.UNKNOWN (0)
      description: "Account type inferred from the name format"

    - source: "groups.items[].id + groups.items[].name"
      target: "user.groups[]"
      type: "array"
      logic: "Map each group item to an OCSF Group object (uid=id, name=name)"
      description: "Groups the user belongs to"

    - source: "tenant.id"
      target: "user.org.uid / user.org.name"
      type: "string"
      logic: "Tenant ID is used for both uid and name of the Organization object"
      description: "Sophos tenant → OCSF organization"

    # CHECKPOINT
    - source: "updatedAt (or createdAt) per user"
      target: "context.known_users[id]"
      type: "string"
      logic: "A full id→timestamp snapshot is persisted at the end of each run. On the next run, users whose timestamp matches the cache are skipped (change-detection)."
      description: "Incremental collection checkpoint for change detection"

  not_mapped:
    - field: "exchangeLogin"
      reason: "No corresponding OCSF field for Exchange login"
    - field: "source.type"
      reason: "Internal Sophos user source type; not relevant to OCSF user model"

  ocsf_samples:
    - name: "Named user with email – OCSF output"
      description: "Transformed OCSF UserOCSFModel for a user with firstName/lastName/email"
      data: |
        {
          "activity_id": 2,
          "activity_name": "Collect",
          "category_name": "Discovery",
          "category_uid": 5,
          "class_name": "User Inventory Info",
          "class_uid": 5003,
          "type_name": "User Inventory Info: Collect",
          "type_uid": 500302,
          "severity": "Informational",
          "severity_id": 1,
          "time": 1686927656.87,
          "metadata": {
            "product": { "name": "Sophos EDR", "version": "N/A" },
            "version": "1.6.0"
          },
          "user": {
            "uid": "00000000-0000-0000-0000-000000000001",
            "name": "Jane Doe",
            "full_name": "Jane Doe",
            "email_addr": "jane.doe@example.com",
            "type_id": 1,
            "type": "User",
            "account": {
              "name": "Jane Doe",
              "type_id": 0,
              "type": "Unknown",
              "uid": "00000000-0000-0000-0000-000000000001"
            },
            "groups": null,
            "org": {
              "uid": "00000000-0000-0000-0000-000000000010",
              "name": "00000000-0000-0000-0000-000000000010"
            }
          }
        }
