mapping:
  ocsf_class: "Software Inventory Info"
  class_uid: 5002
  ocsf_version: "1.6.0"

  source_api: "GET /endpoint/v1/endpoints (view=full)"
  source_field: "modules[]"
  description: |
    Each Sophos endpoint exposes a ``modules`` array listing the Sophos software
    components installed on the device (e.g. coreAgent, interceptX,
    deviceEncryption).  One SoftwareOCSFModel is produced per module entry,
    paired with the parent endpoint as its Device context.
    No additional API call is required — the data is embedded in the standard
    endpoint list response.

  samples:
    - name: "Sophos EDR endpoint module sample"
      description: "Source data: one item from endpoint.modules inside GET /endpoint/v1/endpoints"
      data: |
        {
          "endpoint_id":   "00000000-0000-0000-0000-000000000001",
          "endpoint_type": "computer",
          "hostname":      "example-workstation",
          "os": {
            "platform": "windows",
            "name":     "Windows 10 Pro"
          },
          "ipv4Addresses": ["192.0.2.10"],
          "lastSeenAt":    "2024-01-07T06:26:08.668Z",
          "module": {
            "name":    "coreAgent",
            "version": "2024.2.4.1.0"
          }
        }

  fields:
    # EVENT CLASSIFICATION
    - source: "static: 2"
      target: "activity_id"
      type: "integer"
      description: "OCSF activity ID – always 2 for Collect"

    - source: "static: Collect"
      target: "activity_name"
      type: "string"
      description: "OCSF activity name"

    - source: "static: Discovery"
      target: "category_name"
      type: "string"
      description: "OCSF category name"

    - source: "static: 5"
      target: "category_uid"
      type: "integer"
      description: "OCSF category UID"

    - source: "static: Software Inventory Info"
      target: "class_name"
      type: "string"
      description: "OCSF class name"

    - source: "static: 5002"
      target: "class_uid"
      type: "integer"
      description: "OCSF class UID"

    - source: "static: 500202"
      target: "type_uid"
      type: "integer"
      description: "OCSF type UID"

    - source: "static: Software Inventory Info: Collect"
      target: "type_name"
      type: "string"
      description: "OCSF type name"

    - source: "static: Informational"
      target: "severity"
      type: "string"
      description: "Event severity"

    - source: "static: 1"
      target: "severity_id"
      type: "integer"
      description: "OCSF severity ID"

    # TIMESTAMP
    - source: "lastSeenAt"
      target: "time"
      type: "timestamp"
      logic: "Convert ISO 8601 to Unix epoch; fallback to now() when absent"
      description: "Event timestamp – uses endpoint.lastSeenAt as proxy"

    # METADATA
    - source: "static: Sophos EDR"
      target: "metadata.product.name"
      type: "string"
      description: "Source product name"

    - source: "static: N/A"
      target: "metadata.product.version"
      type: "string"
      description: "Product version (not exposed by Sophos API)"

    - source: "static: 1.6.0"
      target: "metadata.version"
      type: "string"
      description: "OCSF schema version"

    # SOFTWARE (from endpoint.modules[])
    - source: "module.name"
      target: "software.name"
      type: "string"
      description: "Name of the Sophos software module (e.g. coreAgent, interceptX)"

    - source: "module.version"
      target: "software.version"
      type: "string"
      description: "Installed version of the Sophos module"

    - source: "static: Sophos"
      target: "software.vendor_name"
      type: "string"
      description: "All modules in endpoint.modules are Sophos products"

    # SBOM (Software Bill of Materials)
    - source: "module.name + module.version"
      target: "sbom.package.name / sbom.package.version"
      type: "object"
      logic: "Only created when module.version is not null; type=Application (1)"
      description: "OCSF SoftwarePackage derived from the module name/version"

    # DEVICE (parent endpoint context)
    - source: "endpoint.id"
      target: "device.uid"
      type: "string"
      description: "Sophos endpoint UUID"

    - source: "hostname"
      target: "device.hostname / device.name"
      type: "string"
      description: "Device hostname"

    - source: "type"
      target: "device.type / device.type_id"
      type: "string"
      logic: "computer → Desktop (2), server → Server (1), else Unknown (0)"
      description: "OCSF device type derived from endpoint type"

    - source: "os.platform"
      target: "device.os.type / device.os.type_id"
      type: "string"
      logic: "windows→Windows(100), linux→Linux(200), macos→macOS(300), android→Android(201)"
      description: "OCSF OS type"

    - source: "os.name"
      target: "device.os.name"
      type: "string"
      description: "Full OS name of the parent endpoint"

    - source: "ipv4Addresses[0] or ipv6Addresses[0]"
      target: "device.ip"
      type: "ip"
      logic: "Prefer first IPv4; fallback to first IPv6"
      description: "Primary IP of the parent endpoint"

    - source: "static: True"
      target: "device.is_managed"
      type: "boolean"
      description: "Always true – device is enrolled in Sophos Central"

  not_mapped:
    - field: "software.install_time"
      reason: "endpoint.modules does not include an installation date; only name and version are available"
    - field: "software.path"
      reason: "Installation path is not exposed by the Sophos modules list"
    - field: "software.uid"
      reason: "No unique identifier per module in the Sophos API; modules are identified by name+version"
    - field: "sbom.package.license"
      reason: "License information is not exposed by Sophos API"

  ocsf_samples:
    - name: "Software Inventory Info – Sophos EDR module"
      description: "Transformed Sophos endpoint module to OCSF Software Inventory Info"
      data: |
        {
          "activity_id": 2,
          "activity_name": "Collect",
          "category_name": "Discovery",
          "category_uid": 5,
          "class_name": "Software Inventory Info",
          "class_uid": 5002,
          "type_name": "Software Inventory Info: Collect",
          "type_uid": 500202,
          "severity": "Informational",
          "severity_id": 1,
          "time": 1704610568,
          "metadata": {
            "product": { "name": "Sophos EDR", "version": "N/A" },
            "version": "1.6.0"
          },
          "software": {
            "name": "coreAgent",
            "version": "2024.2.4.1.0",
            "vendor_name": "Sophos"
          },
          "sbom": {
            "package": {
              "name": "coreAgent",
              "version": "2024.2.4.1.0",
              "type": "Application",
              "type_id": 1
            }
          },
          "device": {
            "uid": "00000000-0000-0000-0000-000000000001",
            "hostname": "example-workstation",
            "name": "example-workstation",
            "type": "Desktop",
            "type_id": 2,
            "os": { "name": "Windows 10 Pro", "type": "windows", "type_id": 100 },
            "ip": "192.0.2.10",
            "is_managed": true
          }
        }
