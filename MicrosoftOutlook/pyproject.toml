[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "Automation module for Microsoft Outlook"
version = "0.4.1"
description = ""
authors = []
package-mode = false

[tool.black]
line-length = 119
target-version = ["py38"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.11"
files = ["tests", "microsoft_outlook_modules", "main.py"]
mypy_path = "."
exclude = "(^|/)\\.venv/|(^|/)\\.pytest_cache/|(^|/)\\.tmp/"
ignore_missing_imports = true
follow_imports = "skip"
show_column_numbers = true

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
sekoia-automation-sdk = "^1.20.2"
pydantic = "^2.9.2"

[tool.poetry.group.dev.dependencies]
black = ">=25.11.0"
isort = ">=6.1.0"
mypy = ">=1.19.1"
ruff = ">=0.15.20"
pytest = "*"
pytest-cov = "*"
requests = "*"
requests-mock = "*"

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "  --strict-markers\n  --tb=short\n  --cov=microsoft_outlook_modules\n  --cov-branch\n  --cache-clear\n  --cov-report=html\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=5\n  --capture=sys\n"
