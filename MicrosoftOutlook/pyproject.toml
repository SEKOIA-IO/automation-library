[project]
name = "automation-module-microsoft-outlook"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
    "pydantic>=2.9.2,<3",
    "sekoia-automation-sdk>=1.27.0,<2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "requests",
    "requests-mock",
]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.15.20",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
files = ["tests", "microsoft_outlook_modules", "main.py"]
mypy_path = "."
exclude = "(^|/)\\.venv/|(^|/)\\.pytest_cache/|(^|/)\\.tmp/"
ignore_missing_imports = true
follow_imports = "skip"
show_column_numbers = true

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "  --strict-markers\n  --tb=short\n  --cov=microsoft_outlook_modules\n  --cov-branch\n  --cache-clear\n  --cov-report=html\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=5\n  --capture=sys\n"
