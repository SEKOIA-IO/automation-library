[project]
name = "zimperium-automation-module"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.11,<3.15"

dependencies = [
    "cachetools>=5.0.0",
    "orjson>=3.7.7",
    "prometheus-client>=0.16.0",
    "python-dateutil>=2.8.2",
    "requests>=2.34.2",
    "requests-ratelimiter>=0.7.0",
    "sekoia-automation-sdk>=1.23.1",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "requests-mock>=1.12.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["uv_build>=0.9.7,<1.0.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
exclude = ["tests/*"]

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=zimperium_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=5
  --capture=sys
'''

