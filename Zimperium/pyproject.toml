[project]
name = "zimperium-automation-module"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.11,<3.15"

dependencies = [
    "requests>=2.34.2",
    "sekoia-automation-sdk>=1.23.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "requests-mock>=1.12.1",
]

[build-system]
requires = ["uv_build>=0.9.7,<1.0.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=zimperium_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=5
  --capture=sys
'''

