[project]
name = "automation-module-zimperium"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"

dependencies = [
    "cachetools>=6.2.3,<7",
    "orjson>=3.7.7,<4",
    "prometheus-client>=0.16.0,<1",
    "python-dateutil>=2.8.2,<3",
    "requests>=2.34.2,<3",
    "requests-ratelimiter>=0.7.0,<1",
    "sekoia-automation-sdk>=1.24.0,<2",
    "structlog>=26.1.0,<27",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "requests",
    "requests-mock",
]
lint = [
    "ruff>=0.14",
    "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --cache-clear
    --cov=zimperium_modules
    --cov-report=term-missing:skip-covered
    -ra
"""
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", "main.py"]

