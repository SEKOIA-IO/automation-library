[project]
name = "locaterisk-automation-module"
version = "0.1.8"
description = ""
authors = []
requires-python = ">=3.11,<4"

dependencies = [
    "sekoia-automation-sdk",
    "requests (>=2.34.2,<3.0.0)"
]

[build-system]
requires = ["uv_build>=0.9.7,<1.0.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=locaterisk_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=5
  --capture=sys
'''

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "requests-mock (>=1.12.1,<2.0.0)",
    "black (>=26.5.1,<27.0.0)"
]
