[project]
name = "automation-module-cato"
version = "1.0.0"
description = ""
authors = []
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sekoia-automation-sdk>=1.26.0,<2",
    "gql[aiohttp]>=3.5.0,<3.6",
    "aiolimiter>=1.1.0,<2",
    "orjson>=3.7.7,<4",
    "python-dateutil>=2.8.2,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "Faker",
    "types-python-dateutil",
]
lint = [
    "ruff>=0.16.7",
    "mypy>=2.3.1",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
target-version = "py314"
line-length = 119

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"client/schemas/events_feed.py" = ["N815"]  # field names mirror the Cato GraphQL schema

[tool.mypy]
strict = true
allow_untyped_calls = true  # gql and the SDK are partially untyped
plugins = ["pydantic.mypy"]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.coverage.run]
omit = ["cato/metrics.py", "tests/*", "main.py"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = """
    --strict-markers
    --tb=short
    --cov=cato
    --cov=client
    --cov-branch
    --cache-clear
    --cov-report=term-missing:skip-covered
    --cov-fail-under=80
"""
