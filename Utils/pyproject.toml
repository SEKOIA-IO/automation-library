[project]
name = "sekoia-automation-utils"
version = "1.5.0"
description = ""
authors = []
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sekoia-automation-sdk>=1.27.0,<2",
    "jsonpath_ng>=1.5,<2",
    "orjson",
    "lxml",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip>=26.2.1",
    "pytest",
    "pytest-cov",
    "requests-mock",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
install_types = true
non_interactive = true
show_column_numbers = true
show_error_context = false
packages = ["utils"]

[[tool.mypy.overrides]]
# No stubs available for these packages
module = ["jsonpath_ng", "jsonpath_ng.*"]
ignore_missing_imports = true
