[project]
name = "automation-module-bitsight"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.14,<4"
dependencies = [
  "sekoia-automation-sdk>=1.24.0,<2",
  "orjson>=3.8.12,<4",
  "aiohttp>=3.8.5,<3.15",
  "aiolimiter>=1.1.0,<2",
  "loguru>=0.7.3,<1",
  "yarl>=1.20.1,<2",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "pytest-asyncio",
  "aioresponses>=0.7.4,<1",
  "faker>=13.12.0",
]
lint = [
  "ruff>=0.14",
  "mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = """
  --cache-clear
  --asyncio-mode=auto
  --cov=connectors
  --cov=client
  --cov-report=term-missing:skip-covered
  -ra
"""

[tool.coverage.run]
omit = ["tests/*", "main.py", "connectors/metrics.py"]
