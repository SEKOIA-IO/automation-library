[project]
name = "automation-module-azure"
version = "0.0"
description = ""
authors = []
requires-python = ">=3.13,<3.14"
dependencies = [
    "sekoia-automation-sdk>=1.27.0,<2",
    "orjson>=3.9.10,<4",
    "azure-eventhub-checkpointstoreblob-aio>=1.2.0,<2",
    "azure-storage-blob>=12.30.1,<13",
    "azure-eventhub>=5.15.1,<6",
    "azure-identity>=1.25.3,<2",
    "async-lru>=2.0.4,<3",
    "aiofiles>=23.2.1",
    "loguru>=0.7.2,<1",
    "uamqp>=1.6.11,<2",
    "cachetools>=6.2.0,<7",
    "msgraph-sdk>=1.62.0,<2",
    "structlog>=26.1.0,<27",
]

[dependency-groups]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-env",
    "requests",
    "requests-mock",
    "Faker",
    "aioresponses>=0.7.4,<1",
]
lint = [
    "ruff>=0.14",
    "mypy",
    "types-aiofiles",
    "types-python-dateutil",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "E501"]
"dev.py" = ["ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = true
exclude = ["tests/*", "dev.py"]

[[tool.mypy.overrides]]
module = "azure.eventhub.extensions.checkpointstoreblobaio.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]
addopts = "  --strict-markers\n  --tb=short\n  --cov=connectors\n  --cov=azure_helpers\n  --cov-branch\n  --cache-clear\n  --cov-report=term-missing:skip-covered\n  --cov-fail-under=5\n  --asyncio-mode=auto\n"

[tool.coverage.run]
omit = ["tests/*", "main.py", "dev.py"]
