[project]
name = "polyswarm-automation-module"
version = "1.0.0"
description = ""
authors = []
requires-python = ">=3.14,<3.15"

dependencies = [
    "sekoia-automation-sdk>=1.27.0,<2",
    "polyswarm-api>=3.21.0,<4",
    "requests>=2.32.0,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "requests-mock",
]
lint = [
    "ruff>=0.14",
    "mypy",
]


[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
files = ["."]
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
markers = [
    "integration: live API tests (require POLYSWARM_API_KEY)",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=polyswarm_modules
  --cov-branch
  --cov-report=term-missing:skip-covered
  --cov-fail-under=85
  --capture=sys
  -m "not integration"
'''
