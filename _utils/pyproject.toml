[project]
name = "checks"
version = "0.1.0"
description = "Sekoia Automate Modules check"
authors = []
requires-python = ">=3.10,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "python-dateutil>=2.8.2,<3",
    "pillow>=12.2.0,<13",
    "jsonschema>=4.22.0,<5",
    "numpy>=1.26.4,<2",
    "pydantic>=2.7.1,<3",
    "semver>=3.0.2,<4",
    "pyastgrep>=1.3.2,<2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
