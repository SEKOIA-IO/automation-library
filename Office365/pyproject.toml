[project]
name = "automation-module-office365"
version = "0.0"
description = "Collect Microsoft Office 365 audit logs and message traces"
authors = []
requires-python = ">=3.14,<4"

dependencies = [
    "sekoia-automation-sdk>=1.27.2,<2",
    "aiohttp>=3.13.4,<3.14",  # aioresponses 0.7.9 (tests) is not compatible with aiohttp 3.14 (ClientResponse stream_writer)
    "cachetools>=7.0.4,<8",
    "msal>=1.35.0,<2",
    "orjson>=3.11.7,<4",
    "prometheus-client>=0.21,<1",
    "python-dateutil>=2.9.0.post0,<3",
    "requests>=2.32,<3",
    "structlog>=25.5.0,<26",
    "tenacity>=9.1.4,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov",
    "requests-mock",
    "aioresponses>=0.7.6",
    "faker",
]
lint = [
    "ruff>=0.14",
    "mypy",
    "types-cachetools",
    "types-python-dateutil",
    "types-requests",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py314"
fix = true

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/", ".tmp/"]

[tool.coverage.run]
omit = ["tests/*", "main.py", ".tmp/*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = '''
  --strict-markers
  --tb=short
  --cov=office365
  --cov-branch
  --cache-clear
  --cov-report=term-missing:skip-covered
  --cov-fail-under=100
  --capture=sys
  -ra
'''
