              "model": "Latitude 5520",
              "networkAdapters": [
                {
                  "caption": "Intel(R) Ethernet Connection",
                  "macAddress": "AA:BB:CC:DD:EE:FF",
                  "malformedData": null
                }
              ]
            }
          ],
          "deployedComponents": [
            {
              "displayName": "ESET Endpoint Security",
              "version": {
                "id": "10.0.2045.0",
                "major": 10,
                "minor": 0,
                "name": "ESET Endpoint Security 10.0",
                "patch": 2045
              },
              "id": 1,
              "name": "eea"
            }
          ],
          "activeProducts": [
            {
              "activateDate": { "year": 2025, "month": 1, "day": 15 },
              "subscriptionUuid": "sub-uuid-123",
              "unitPoolUuid": "pool-uuid-456",
              "validityDate": { "year": 2026, "month": 1, "day": 15 },
              "id": 10,
              "name": "ESET PROTECT Entry"
            }
          ],
          "cloningConfiguration": {
            "cloneNamingPatterns": ["DESKTOP-*"],
            "securityGroupUuid": "sec-group-uuid-1",
            "securityGroupDisplayName": "Default Security Group"
          }
        }

    - name: "ESET Device Group Sample"
      description: "A sample device group from GET /v1/device_groups"
      data: |
        {
          "uuid": "group-uuid-1",
          "displayName": "Finance Department",
          "isSecurityGroup": false,
          "linkedEntityType": "DEVICE_GROUP_ENTITY_TYPE_UNSPECIFIED",
          "parentGroupUuid": "root-group-uuid"
        }

  fields:
    - source: "uuid"
      target: "device.uid"
      type: "string"
      logic: "Direct mapping — ESET device UUID becomes the OCSF device UID"
      description: "Unique identifier for the device"

    - source: "displayName"
      target: "device.hostname"
      type: "string"
      logic: "displayName is used as the OCSF hostname; falls back to originalDisplayName then uuid"
      description: "Device display name used as hostname"

    - source: "displayName"
      target: "device.name"
      type: "string"
      logic: "Direct mapping"
      description: "Human-readable device name"

    - source: "description"
      target: "device.desc"
      type: "string"
      logic: "Direct mapping"
      description: "Optional device description"

    - source: "deviceType / isMobile"
      target: "device.type / device.type_id"
      type: "string / integer"
      logic: |
        isMobile=true → MOBILE (5); deviceType contains SERVER → SERVER (1);
        contains VIRTUAL → VIRTUAL (6); default → DESKTOP (2)
      description: "OCSF device type classification"

    - source: "operatingSystem.familyId"
      target: "device.os.type / device.os.type_id"
      type: "string / integer"
      logic: |
        1 → windows/100, 2 → macos/300, 3 → linux/200,
        4 → android/201, 5 → ios/301, null → unknown/0, other → other/99
      description: "OCSF OS type derived from ESET OS family ID"

    - source: "operatingSystem.displayName"
      target: "device.os.name"
      type: "string"
      logic: "Direct mapping; falls back to operatingSystem.version.name"
      description: "Operating system display name"

    - source: "primaryLocalIpAddress"
      target: "device.ip"
      type: "string"
      logic: "Direct mapping"
      description: "Primary local IP address of the device"

    - source: "primaryLocalIpAddress + publicIpAddress + hardwareProfiles[].networkAdapters[].macAddress"
      target: "device.network_interfaces"
      type: "list[NetworkInterface]"
      logic: |
        First NetworkInterface built from primaryLocalIpAddress (type=Wired).
        MAC address from first hardware profile adapter enriches it.
        Additional adapters create extra NetworkInterface entries.
        publicIpAddress (if different from primaryLocalIpAddress) is added as a separate
        NetworkInterface with type=Unknown.
      description: "List of OCSF network interfaces"

    - source: "managementDomain"
      target: "device.domain"
      type: "string"
      logic: "Direct mapping"
      description: "Management domain of the device"

    - source: "hardwareProfiles[0].manufacturer"
      target: "device.vendor_name"
      type: "string"
      logic: "Manufacturer taken from the first hardware profile if present"
      description: "Hardware vendor/manufacturer name"

    - source: "lastSyncTime"
      target: "device.last_seen_time"
      type: "timestamp (Unix epoch float)"
      logic: "ISO 8601 string parsed with dateutil.isoparse(), converted to .timestamp()"
      description: "Epoch timestamp of last device sync"

    - source: "lastSyncTime"
      target: "time"
      type: "timestamp (Unix epoch float)"
      logic: "Same as last_seen_time; falls back to datetime.utcnow() if null"
      description: "Event time (top-level OCSF field)"

    - source: "hardwareProfiles[0].model"
      target: "device.model"
      type: "string"
      logic: "Model taken from the first hardware profile if present"
      description: "Device hardware model"

    - source: "parentGroupUuid → deviceGroups"
      target: "device.groups"
      type: "list[Group]"
      logic: |
        Pre-loaded group map (from /v1/device_groups) is keyed by uuid.
        If device.parentGroupUuid matches a group, that group is added as an OCSF Group
        with name=displayName and uid=uuid.
      description: "OCSF groups the device belongs to"

    - source: "static: true"
      target: "device.is_managed"
      type: "boolean"
      logic: "All devices returned by the ESET API are managed devices"
      description: "Whether the device is managed"

    - source: "static: ESET EDR"
      target: "metadata.product.name"
      type: "string"
      logic: "Static value"
      description: "Product name in OCSF metadata"

    - source: "static: 2 / Collect"
      target: "activity_id / activity_name"
      type: "integer / string"
      logic: "Device inventory collection maps to OCSF activity Collect (2)"
      description: "OCSF activity classification"

    - source: "static: 5001 / Device Inventory Info"
      target: "class_uid / class_name"
      type: "integer / string"
      logic: "Static OCSF class for device inventory"
      description: "OCSF class classification"

  ocsf_samples:
    - name: "Transformed OCSF Device Output"
      description: "The OCSF DeviceOCSFModel produced after transformation"
      data: |
        {
          "activity_id": 2,
          "activity_name": "Collect",
          "category_name": "Discovery",
          "category_uid": 5,
          "class_name": "Device Inventory Info",
          "class_uid": 5001,
          "type_name": "Device Inventory Info: Collect",
          "type_uid": 500102,
          "time": 1747821600.0,
          "metadata": {
            "product": { "name": "ESET EDR", "version": "9.1.2500.0" },
            "version": "1.5.0"
          }
          "device": {
